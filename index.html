<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seline Daily">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<link rel="icon" type="image/png" href="icon-192.png?v=4">
<link rel="manifest" href="manifest.webmanifest?v=4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDE3D2">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Seline's Daily Edit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&family=Syne:wght@600;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: a sticker-zine column. Thick ink outlines, hard offset shadows, one color-blocked panel per section; the dialogue is a chat thread. */
:root{
  --bg:#EDE3D2; --surface:#FBF7EF; --ink:#1B2321; --muted:#5A615E; --edge:#D6C9B3;
  --hot:#4F7868; --on-hot:#FFFFFF; --pop:#7A5A14; --on-pop:#FFFFFF; --mint:#DCE8E1; --on-mint:#2F5A4B;
  --sky:#E9E6DF; --on-sky:#1B2321;
  --drill-bg:#14352E; --drill-fg:#F2F0EC; --drill-hi:#DFC585;
  --display:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --latin:"Source Sans 3","Helvetica Neue","Segoe UI",Arial,sans-serif;
}
:root{color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.7}
.wrap{max-width:640px;margin:0 auto;padding-inline:18px;padding-block:26px 64px;display:flex;flex-direction:column;gap:30px}
h1,h2,h3,p,ol{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.box{border:2.5px solid var(--edge);border-radius:20px;box-shadow:5px 5px 0 var(--edge)}

/* 머리 */
.mast{display:flex;flex-direction:column;gap:12px}
.mast .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mast h1{font-family:var(--display);font-weight:400;font-size:3.6rem;line-height:1;letter-spacing:-.01em}
.mast h1 span{color:var(--hot)}
.stamp{font-family:var(--latin);font-weight:800;font-size:.8rem;letter-spacing:.06em;background:var(--pop);color:var(--on-pop);border:2.5px solid var(--edge);border-radius:999px;padding:6px 14px;transform:rotate(-4deg);white-space:nowrap}
.date{font-size:1rem;color:var(--muted)}
.daynav{display:flex;gap:8px}
.daynav button{background:var(--surface);border:2px solid var(--edge);border-radius:999px;padding:3px 14px;font-size:.88rem}
.daynav button:disabled{opacity:.3;cursor:default}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;padding-block:8px}
.tabs a{flex:1;text-align:center;text-decoration:none;font-family:var(--display);font-size:1.02rem;padding:7px 6px;border:2.5px solid var(--edge);border-radius:14px;background:var(--surface)}
.tabs a:nth-child(1){background:var(--pop);color:var(--on-pop)}
.tabs a:nth-child(2){background:var(--hot);color:var(--on-hot)}
.tabs a:nth-child(3){background:var(--mint);color:var(--on-mint)}

section{display:flex;flex-direction:column;gap:18px;scroll-margin-top:70px}
.label{align-self:flex-start;font-family:var(--display);font-size:.95rem;padding:3px 14px;border:2.5px solid var(--edge);border-radius:999px}
h2{font-family:var(--display);font-weight:400;font-size:1.85rem;line-height:1.25;text-wrap:balance}
.sub{color:var(--muted);font-size:.95rem}

/* 영어: 채팅 */
#english .label{background:var(--pop);color:var(--on-pop)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools button{background:var(--surface);border:2px solid var(--edge);border-radius:999px;padding:5px 14px;font-size:.9rem}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chat{background:var(--sky);color:var(--on-sky);padding:18px 14px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;flex-direction:column;gap:3px;max-width:86%;min-width:0}
.msg.b{align-self:flex-end;align-items:flex-end}
.bubble{background:var(--surface);color:var(--ink);border:2.5px solid var(--edge);border-radius:18px 18px 18px 4px;padding:9px 14px;text-align:left;font-family:var(--latin);font-size:1.1rem;line-height:1.4;font-weight:600}
.msg.b .bubble{background:var(--pop);color:var(--on-pop);border-radius:18px 18px 4px 18px}
button.bubble:active{transform:translate(2px,2px)}
.msg .ko{font-size:.88rem;padding-inline:6px;opacity:.85}
.hint{font-size:.85rem;text-align:center;opacity:.8}
.exprs{display:grid;gap:14px}
.expr{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.expr h3{font-family:var(--latin);font-weight:800;font-size:1.25rem;line-height:1.3}
.expr h3 i{font-style:normal;display:inline-block;background:var(--pop);color:var(--on-pop);border-radius:6px;padding:0 6px;margin-right:6px;font-size:.9rem}
.expr p{font-size:.97rem}
.expr .eg{font-family:var(--latin);color:var(--muted);font-size:1rem}
.drill{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.drill h3{font-family:var(--display);font-weight:400;font-size:1.15rem;color:var(--pop)}
.drill .pat{font-family:var(--latin);font-weight:800;font-size:1.3rem;line-height:1.3}
.drill ol{padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-family:var(--latin);font-size:1.05rem}
.drill small{font-family:var(--body);opacity:.8;font-size:.86rem}
.drill b{color:var(--pop);font-weight:800}

/* 뉴스 */
#news .label{background:var(--hot);color:var(--on-hot)}
.news{display:flex;flex-direction:column;gap:16px}
.news article{background:var(--surface);padding:16px 16px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.news .n{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--hot);grid-row:1/3}
.news .tag{justify-self:start;font-size:.78rem;border:2px solid var(--edge);border-radius:999px;padding:0 9px;background:var(--mint);color:var(--on-mint)}
.news h3{font-size:1.12rem;font-weight:700;line-height:1.45;text-wrap:balance;min-width:0}
.news p{grid-column:1/-1;font-size:.98rem}
.news .src{font-size:.84rem;color:var(--muted)}

/* 날씨 */
#weather .label{background:var(--mint);color:var(--on-mint)}
.now{background:var(--mint);color:var(--on-mint);padding:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.now .t{font-family:var(--display);font-size:4.2rem;line-height:1}
.now .d{display:flex;flex-direction:column;min-width:0}
.now .d b{font-size:1.15rem}
.alert{background:var(--hot);color:var(--on-hot);padding:12px 16px;font-size:.96rem;border:2.5px solid var(--edge);border-radius:14px}
.cities{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.city{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.city h3{font-family:var(--display);font-weight:400;font-size:1.05rem}
.city .r{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;font-variant-numeric:tabular-nums}
.city .r span:last-child{white-space:nowrap}
.city em{font-style:normal;color:var(--muted);font-size:.82rem;margin-left:4px}
footer{color:var(--muted);font-size:.84rem}
/* 정제된 톤: 얇은 선, 그림자 없음, 가는 숫자 */
body{font-weight:400;letter-spacing:-.005em}
.box{border:1px solid var(--edge);border-radius:14px;box-shadow:none}
.mast h1{font-weight:300;font-size:3rem;letter-spacing:-.03em}
.mast h1 span{color:var(--pop);font-weight:600}
.stamp{transform:none;font-weight:500;letter-spacing:.14em;background:none;color:var(--pop);border:1px solid var(--pop)}
.daynav button,.tools button,.news .tag,.alert{border-width:1px}
.tabs{border-bottom:1px solid var(--edge);gap:0}
.tabs a:nth-child(n){background:none;color:var(--muted);border:0;border-radius:0;font-weight:500;font-size:.98rem;letter-spacing:.04em}
.tabs a:nth-child(n):hover{color:var(--ink)}
.label{border:0;padding:0;border-radius:0;font-weight:600;font-size:.8rem;letter-spacing:.16em}
#english .label,#news .label,#weather .label,#life .label{background:none;color:var(--pop)}
.tips{list-style:none;padding:0;display:flex;flex-direction:column;background:var(--surface)}
.tips li{display:grid;grid-template-columns:2.2em 1fr;gap:4px 8px;padding:14px 16px;border-bottom:1px solid var(--edge)}
.tips li:last-child{border-bottom:0}
.tips .k{font-family:var(--latin);font-weight:300;font-size:1.5rem;line-height:1.2;color:var(--pop)}
.tips b{font-weight:600;display:block}
.tips span{min-width:0;font-size:.97rem}
.lifesrc{font-size:.84rem;color:var(--muted)}
#fact .label,#trend .label{background:none;color:var(--pop)}
.asof{font-size:.84rem;color:var(--muted)}
#shows .label{background:none;color:var(--pop)}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs a:nth-child(n){flex:1 0 auto;padding-inline:12px}
.showlist{list-style:none;margin:0;padding:0;background:var(--surface);display:flex;flex-direction:column}
.showlist li{display:grid;grid-template-columns:3.4em 1fr;gap:2px 12px;padding:14px 16px;border-bottom:1px solid var(--edge)}
.showlist li:last-child{border-bottom:0}
.showlist .kind{font-size:.78rem;font-weight:600;color:var(--pop);padding-top:3px}
.showlist .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.showlist b{font-weight:600;font-size:1.02rem}
.showlist .when{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.showlist .memo{font-size:.92rem}
#music .label{background:none;color:var(--pop)}
.listen{display:flex;flex-wrap:wrap;gap:10px}
.listen a{font-size:.9rem;font-weight:500;color:var(--ink);text-decoration:none;border:1px solid var(--ink);padding:7px 14px}
.listen a:hover{background:var(--ink);color:var(--bg)}
.showlist .stitle{color:var(--ink);text-decoration:none}
.showlist .stitle:hover b{text-decoration:underline;text-underline-offset:4px}
.showlist .more{align-self:flex-start;margin-top:6px;font-size:.86rem;font-weight:500;color:var(--ink);text-decoration:none;border:1px solid var(--ink);padding:5px 12px}
.showlist .more:hover{background:var(--ink);color:var(--bg)}
.factbox{background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:12px}
.factbox p{font-size:1rem}
.factbox ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.tabs a:nth-child(n){font-size:.9rem;letter-spacing:0;padding-inline:2px;white-space:nowrap}
.quote{margin:0;padding:22px 20px;background:var(--drill-bg);color:var(--drill-fg);border-radius:14px;display:flex;flex-direction:column;gap:10px}
.quote .q{font-size:.8rem;font-weight:600;letter-spacing:.16em;color:var(--drill-hi)}
.quote .ko{font-size:1.3rem;font-weight:500;line-height:1.55;letter-spacing:-.02em;text-wrap:balance}
.quote .en{font-family:var(--latin);font-weight:300;font-size:1.08rem;line-height:1.5;opacity:.9}
.quote .by{font-size:.86rem;opacity:.75}
:root{--aq1:#3E8E5A;--aq2:#C29A1E;--aq3:#D0702F;--aq4:#B23A3A;--aq5:#7A3A7A}
.air{background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px}
.air h3{font-weight:600;font-size:1.05rem}
.air .meta{font-size:.86rem;color:var(--muted)}
.airrow{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 2.6em;gap:10px;align-items:center;font-size:.93rem}
.airrow .bar{height:8px;border-radius:999px;background:var(--edge);overflow:hidden}
.airrow .bar i{display:block;height:100%;border-radius:999px}
.airrow .v{font-family:var(--latin);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.voice{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);min-width:0}
.voice select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--edge);border-radius:999px;padding:5px 12px;max-width:12em}
h2{font-weight:600;font-size:1.6rem;letter-spacing:-.02em}
.bubble{border:1px solid var(--edge);font-weight:400;font-size:1.08rem}
.msg.b .bubble{background:var(--hot);color:var(--on-hot);border-color:var(--hot)}
.expr h3{font-weight:600;font-size:1.15rem}
.expr h3 i{background:none;color:var(--pop);padding:0;font-weight:500}
.drill{background:var(--drill-bg);color:var(--drill-fg);border-radius:14px}
.drill h3{font-weight:600;font-size:.85rem;letter-spacing:.14em;color:var(--drill-hi)}
.drill .pat{font-weight:500}
.drill b{color:var(--drill-hi);font-weight:600}
.news .n{font-family:var(--latin);font-weight:300;color:var(--pop)}
.news h3{font-weight:600}
.now{background:var(--hot);color:var(--on-hot);border-color:var(--hot)}
.now .t{font-family:var(--latin);font-weight:300}
.now .d b{font-weight:500}
.city h3{font-weight:600;font-size:.98rem}
/* ===== 매거진 레이아웃: 큰 제호, 표지 문장, 차례, 굵은 괘선과 2단 그리드 ===== */
:root{--edit:"Source Sans 3","IBM Plex Sans KR","Helvetica Neue","Apple SD Gothic Neo",sans-serif}
.mast .tag,.quote .en,.tabs a .go,.tochead,.expr h3 i,.drill .pat,.news .n,.tips .k,.h-en,.msg .sp{font-style:normal !important}
body{word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:780px;gap:56px;padding-block:20px 80px}
.strip{display:flex;justify-content:space-between;gap:12px;font-family:var(--latin);font-size:.72rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);padding:7px 0;color:var(--ink)}
.mast{gap:14px}
.mast .row{align-items:flex-end}
.mast h1{font-family:"Cormorant Garamond","Garamond","Baskerville","Times New Roman",serif;font-weight:500;font-size:clamp(1.7rem,7.4vw,3.6rem);line-height:1.22;letter-spacing:.14em;text-transform:uppercase;min-width:0}
.mast h1 span{display:block;color:var(--ink);font-weight:500;font-style:normal}
.mast .row{flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:12px}
.cup{display:block;position:relative;overflow:hidden;flex:0 0 auto;width:clamp(104px,30vw,190px);aspect-ratio:1;border-radius:50%;margin-bottom:.2em}
.cup img{display:block;width:100%;height:100%;max-width:none;object-fit:cover}
/* 잔 속 커피만 잘라 천천히 좌우로 돌려 찰랑이는 느낌을 준다 */
.cup .swirl{position:absolute;inset:0;clip-path:circle(36% at 48.2% 35.4%);transform-origin:48.2% 35.4%;animation:swirl 3.6s ease-in-out infinite alternate}
@keyframes swirl{from{transform:rotate(-6deg) scale(1.015)}to{transform:rotate(6deg) scale(1.03)}}
@media (prefers-reduced-motion:reduce){.cup .swirl{animation:none;display:none}}
.mast .tag{font-family:var(--body);font-size:1rem;font-weight:500;letter-spacing:.3em;line-height:1.2;color:var(--pop)}
.stamp{display:none}
.mast .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--edge);padding-top:10px}
.daynav button{border-radius:0;border-color:var(--ink);background:none;font-size:.82rem}
.quote{border-radius:0;padding:clamp(28px,7vw,56px) clamp(20px,6vw,48px);gap:16px}
.quote .q{font-family:var(--latin);letter-spacing:.22em;font-size:.72rem}
.photo{margin:0;display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--ink);padding-top:14px}
.photo .plabel{font-size:.74rem;font-weight:600;letter-spacing:.16em;color:var(--pop)}
.photo img{display:block;width:100%;max-width:100%;height:auto}
.photo figcaption{display:flex;justify-content:space-between;gap:12px;font-size:.95rem}
.photo .pdate{color:var(--muted);font-family:var(--latin);font-size:.82rem;white-space:nowrap}
.quote .pick{border-top:1px solid color-mix(in srgb,var(--drill-fg) 30%,transparent);padding-top:14px;margin-top:6px;font-size:.95rem;line-height:1.65}
.quote .pick b{display:block;font-size:.72rem;letter-spacing:.16em;color:var(--drill-hi);font-weight:600;margin-bottom:4px}
.quote .ko{font-size:clamp(1.28rem,4.96vw,2.16rem);font-weight:600;line-height:1.3;letter-spacing:-.04em}
.quote .en{font-family:var(--edit);font-style:italic;font-weight:400;font-size:clamp(1.2rem,4.4vw,1.7rem);line-height:1.25;opacity:1;color:var(--drill-hi)}
.tabs{position:static;display:grid;grid-template-columns:1fr;gap:0;padding:0;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);overflow:visible;background:none}
.tabs a:nth-child(n){display:grid;grid-template-columns:5.2em 1fr auto;gap:12px;align-items:baseline;text-align:left;padding:12px 0;border-bottom:1px solid var(--edge);border-radius:0;white-space:normal;color:var(--ink);font-size:1rem;letter-spacing:-.01em;font-weight:500}
.tabs a:last-child{border-bottom:0}
.tabs a .sec{font-size:.74rem;font-weight:600;letter-spacing:.14em;color:var(--pop)}
.tabs a .ttl{min-width:0}
.tabs a .go{font-family:var(--edit);font-style:italic;color:var(--muted);font-size:1.1rem}
.tabs a:nth-child(n):hover .ttl{text-decoration:underline;text-underline-offset:4px}
.h-en{display:block;font-family:var(--edit);font-style:italic;font-weight:400;letter-spacing:0;color:var(--muted);font-size:.52em;line-height:1.2;margin-top:.3em}
h3 .h-en{font-size:.82em}

.tochead{font-family:var(--edit);font-style:italic;font-size:1.5rem;line-height:1;margin-bottom:-44px}
section{gap:20px;border-top:3px solid var(--ink);padding-top:14px}
.label,#english .label,#news .label,#life .label,#fact .label,#trend .label,#shows .label{font-family:var(--body);font-size:.74rem;letter-spacing:.16em;color:var(--pop)}
h2{font-size:clamp(1.52rem,5.3vw,2.4rem);font-weight:700;line-height:1.18;letter-spacing:-.045em}
.sub{font-size:1.02rem;max-width:36em}
.box{border-radius:0}
.chat{border:0;padding:22px 16px}
.bubble{border-radius:16px 16px 16px 2px}
.msg.b .bubble{border-radius:16px 16px 2px 16px}
.expr{border:0;border-top:1px solid var(--ink);padding:14px 0 0;background:none}
.expr h3{font-size:1.3rem;letter-spacing:-.02em}
.expr h3 i{font-family:var(--edit);font-style:italic;font-size:1.5rem;margin-right:10px}
.drill{border-radius:0;padding:22px}
.drill .pat{font-family:var(--edit);font-style:italic;font-weight:400;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.15}
.news{gap:0}
.news article{border:0;border-top:1px solid var(--ink);background:none;padding:18px 0 22px;grid-template-columns:auto 1fr;gap:6px 14px}
.news article:first-child{border-top:0;padding-top:0}
.news .n{font-family:var(--edit);font-style:italic;font-weight:400;font-size:3rem;line-height:.9}
.news h3{font-size:1.25rem;font-weight:700;letter-spacing:-.03em;line-height:1.35}
.news article:first-child h3{font-size:clamp(.9rem,3.24vw,1.26rem);line-height:1.4}
.news .tag{border:0;background:none;padding:0;color:var(--pop);font-weight:600;letter-spacing:.12em;font-size:.72rem}
.factbox{border:0;background:none;padding:0}
.factbox>p{font-size:1.12rem;line-height:1.8}
.factbox ul{border-top:1px solid var(--edge);padding-top:14px}
.tips,.showlist{border:0;border-top:1px solid var(--ink);background:none}
.tips li,.showlist li{padding-inline:0}
.tips .k{font-family:var(--edit);font-style:italic;font-size:1.9rem;font-weight:400}
.showlist li{grid-template-columns:4.2em 1fr}
.showlist .kind{letter-spacing:.1em}

      ["B","Ooh, I'm in. I'll bring a board game, one that won't end in a fight this time.","오, 좋아. 난 보드게임 가져갈게. 이번엔 싸움으로 안 끝나는 걸로."],
      ["A","Ha, no promises. Let's play it by ear and see if it clears up by the evening.","하하, 장담은 못 해. 상황 봐 가면서 저녁쯤 개는지 보자."],
      ["B","Deal. If it does, we can at least take a walk around the lake.","좋아. 개면 호수 한 바퀴라도 걷자."]
    ],
    expressions: [
      {en:"look forward to ~", ko:"‘~을 기대하다, 손꼽아 기다리다’. 뒤에는 명사나 -ing가 옵니다. was really looking forward to처럼 과거진행형으로 말하면 기대했던 일이 틀어져 아쉬운 마음이 묻어납니다.", eg:"I'm really looking forward to seeing you this weekend."},
      {en:"call (something) off", ko:"‘(계획이나 행사를) 취소하다’. cancel과 같은 뜻의 구어 표현으로, 날씨나 사정 때문에 약속을 접을 때 자주 씁니다.", eg:"They called off the game because of the rain."},
      {en:"take a rain check", ko:"‘이번엔 미루고 다음에 하자’. 원래는 비로 경기가 취소될 때 주던 다음 경기 입장권에서 온 말로, 제안을 거절하지 않고 뒤로 미룰 때 씁니다.", eg:"I can't make it to dinner tonight. Can I take a rain check?"},
      {en:"hunker down", ko:"‘(한곳에) 틀어박혀 버티다’. 궂은 날씨나 바쁜 시기에 집에 머물며 지내거나, 한 가지 일에 집중할 때 씁니다.", eg:"We're just going to hunker down and watch movies until the storm passes."},
      {en:"play it by ear", ko:"‘상황 봐 가며 정하다’. 미리 계획을 딱 정하지 않고 그때그때 맞춰 하자고 할 때 씁니다.", eg:"I'm not sure when I'll be done. Let's play it by ear."}
    ],
    pattern: {

      ko: "‘이왕 이렇게 된 거 ~하는 게 낫겠다, ~하는 편이 좋겠다’. 더 나은 선택지가 없을 때, 그나마 할 만한 쪽으로 마음을 정하며 쓰는 표현입니다. 혼자라면 I might as well ~이라고 합니다.",
      examples: [
        ["We might as well <b>stay</b> in and <b>cook</b>.","이왕 이렇게 된 거 집에서 요리나 하자."],
        ["The bus is <b>late</b>, so we might as well <b>walk</b>.","버스가 늦으니까 그냥 걸어가는 게 낫겠어."],

     lead:"오사카의 라멘집 ‘진루이(Human Beings Everybody Noodles)’가 프탈링자야 다만사라 프르다나에 말레이시아 첫 매장 ‘진루이 라멘 말레이시아’를 열었어요. 말레이 메일의 이선 라우가 직접 값을 내고 먹어 본 뒤 소개했어요.",
     pts:["2012년 마쓰무라 다카히로가 세운 가게로, 2025년 타베로그가 꼽은 오사카 라멘 100선에 들었어요", "대표 메뉴 ‘프리미엄’(29링깃)은 조개와 닭 육수의 쇼유 라멘에 가리비 기름과 수비드 닭고기를 올려요. 말레이시아 입맛에 맞춘 매운 ‘레드’도 있어요", "돼지고기·라드·술을 쓰지 않아요. 할랄 인증 공급처의 재료를 쓴다고 밝혔지만, 매장의 할랄 인증은 아직 기다리는 중이에요"],

     lead:"크마만 지역의 농업관 누르 샤즈와니 모흐드 살레(41)가 유엔 식량농업기구(FAO)의 ‘2026 농식품 시스템·농촌 개발 분야 여성 영웅 100인’에 뽑혀, 15일 이탈리아 로마에서 상을 받았어요.",
     pts:["후보 609명 가운데 100명이 뽑혔고, 말레이시아는 농업식량안보부 산하 기관에서 9명을 추천했어요", "2024년부터 크마식 일대 7개 공동체와 함께, 마을회관 옆 빈터 같은 놀던 땅 약 1헥타르에 채소와 로젤을 길러 시장에 내다 팔아요. 참여자 약 70명은 대부분 여성이에요", "넓은 땅 없이 작물을 기르는 이동식 수경재배 장치도 만들었고, 텃밭 사업을 크마만의 다른 지역으로 넓힐 계획이에요"],

     lead:"일본항공(JAL)의 저비용 자회사 집에어(ZIPAIR)가 도쿄 나리타와 쿠알라룸푸르 국제공항(KLIA)을 잇는 직항편을 매일 운항하기 시작했어요. 일본을 오가는 사람이라면 알아둘 만해요.",
     pts:["첫 편 ZG61은 20일 화요일 오후 4시 50분 나리타를 떠나 밤 11시 40분 KLIA 1터미널에 내렸어요", "보잉 787‑8 드림라이너로 290석(풀플랫 비즈니스 18석, 이코노미 272석)이고, 일주일에 2,030석이 늘어나요", "올해 1~8월 말레이시아를 찾은 일본인은 28만 3,132명으로, 지난해 같은 기간보다 4.0% 늘었어요"],

     lead:"케임브리지대학교의 2027년 입학 지원자 면접이 12월 7일부터 18일까지 열려요. 10월에 케임브리지에 지원한 자녀를 둔 가정이 알아둘 일정이에요.",
     pts:["면접 초대는 대부분 11월에 오고, 일부는 12월 초에 와요", "영국 밖에 사는 지원자의 면접 방식은 칼리지마다 달라요. 코퍼스 크리스티, 피터하우스, 로빈슨 등은 온라인으로 하고, 펨브로크와 트리니티는 온라인과 대면 가운데 고를 수 있어요", "보통 면접 방식을 따로 요청할 수는 없지만, 비자 신청이 거절된 경우처럼 예외적인 상황에서는 다른 방식을 내줄 수 있어요. 10월 지원자의 결과는 1월에 나와요"],

    intro: "오늘 소식처럼 27일부터 북동 몬순이 시작되면 말레이어로 된 기상 경보를 자주 보게 됩니다. 경보의 종류와 색깔 단계, 확인할 곳을 SAYS와 말레이 메일 보도에서 골랐습니다.",
    tips: [
      ["경보는 크게 두 가지","‘아마란 후잔 브르트루산(amaran hujan berterusan)’은 앞으로 1~3일 이어지는 비에 대한 경보입니다. ‘아마란 리붓 프티르(amaran ribut petir)’는 시간당 20mm가 넘는 뇌우가 내리고 있거나 곧 올 때 내는 짧은 경보로, 한 번에 6시간을 넘지 않습니다."],
      ["노랑은 ‘와스파다(Waspada)’","‘주의’라는 뜻의 노란 단계로, 1~3일 안에 계속되는 비가 시작되거나 지금 내리는 비나 뇌우가 이어질 것으로 보일 때 냅니다."],
      ["주황 ‘부룩’, 빨강 ‘바하야’","부룩(Buruk)은 ‘나쁨’, 바하야(Bahaya)는 ‘위험’이라는 뜻입니다. 부룩은 큰비가 계속될 때, 바하야는 아주 강한 비가 계속될 때 냅니다."],
      ["시간당 몇 mm가 ‘큰비’일까","슬랑오르 관개배수국(JPS) 기준으로 시간당 1~10mm는 약한 비, 11~30mm는 보통, 31~60mm는 강한 비, 60mm가 넘으면 아주 강한 비입니다. 슬랑오르 지역의 강우 자료는 InfoBanjir JPS 슬랑오르 사이트에서 볼 수 있습니다."],
      ["공식 채널에서 확인하기","기상청은 met.gov.my 웹사이트와 myCuaca 앱, 공식 SNS, 핫라인 1-300-22-1638로 예보와 경보를 알리고, 이 정보를 따라 대비하라고 당부합니다."]

    title: "10월 24일, 나무통을 타고 나이아가라를 넘은 날", titleEn: "October 24, 1901: Annie Edson Taylor Goes Over Niagara Falls in a Barrel",
    body: "1901년 10월 24일, 미국의 교사 출신 애니 에드슨 테일러가 63번째 생일에 나무통을 타고 나이아가라 폭포를 넘어, 폭포에서 떨어지고도 살아남은 첫 사람이 되었습니다. 집이 불타고 투자한 돈까지 잃어 형편이 어려워지자, 이 일로 돈을 벌어 남은 생을 편히 보내려 했습니다. 그녀가 탄 통은 미국 쪽 기슭 가까이에서 강물에 띄워져 캐나다 쪽 호스슈 폭포로 떨어졌고, 그녀는 머리에 작은 상처를 입었을 뿐 거의 다치지 않았습니다.",
    more: [
      "통은 참나무와 쇠로 만들고 안에 매트리스를 댔으며, 뚜껑을 닫은 뒤 친구들이 자전거 펌프로 공기를 채우고 구멍을 코르크로 막았습니다.",
      "이틀 전에는 고양이를 태운 통을 먼저 호스슈 폭포로 띄워 시험했는데, 고양이는 머리에 상처를 입은 채 살아남았습니다.",
      "기대했던 돈은 벌지 못했습니다. 매니저가 통을 가지고 달아나 사립 탐정에게 저축 대부분을 썼고, 회고록을 팔고 기념품 가게에서 관광객과 사진을 찍으며 지내다 1921년 82세에 가난 속에 세상을 떠났습니다."

    title: "단풍철 주말, 친구와 사과 따기 나들이 계획하기", titleEn: "Planning a Fall Apple-Picking Trip With a Friend",
    situation: "나뭇잎이 물들기 시작한 가을, 친구에게 주말에 근교 과수원으로 사과를 따러 가자고 제안하는 대화입니다. 들뜬 마음을 표현하고, 출발 시간과 준비물을 가볍게 맞추는 말투를 익혀 보세요.",
    lines: [
      ["A","Hey, the leaves are finally turning. Want to go apple picking this weekend?","있잖아, 드디어 단풍이 들기 시작했어. 이번 주말에 사과 따러 갈래?"],
      ["B","Oh, I'm so in. I've been itching to do something outdoorsy.","오, 완전 좋아. 밖에서 뭐 좀 하고 싶어서 몸이 근질근질했거든."],
      ["A","There's an orchard about an hour north. They've got a corn maze and hayrides, too.","북쪽으로 한 시간쯤 가면 과수원이 있어. 옥수수밭 미로랑 건초 마차도 있대."],
      ["B","Fun! Fair warning, though: last time I went overboard and came home with twenty pounds of apples.","재밌겠다! 근데 미리 말해 두는데, 지난번엔 너무 신나서 사과를 9킬로나 따 왔어."],
      ["A","Ha, that's half the fun. We can bake a pie with whatever's left over.","하하, 그게 또 재미지. 남는 걸로 파이 구우면 되지."],
      ["B","Deal. Should we head out early? Those places get mobbed on weekends.","좋아. 일찍 출발할까? 거기 주말엔 사람이 미어터지잖아."],
      ["A","Good call. Let's aim to leave by nine. I'll come get you.","좋은 생각이야. 아홉 시까지는 출발하는 걸로 하자. 내가 데리러 갈게."],
      ["B","Perfect. I'll bring coffee for the road. And dress in layers. It gets chilly out there.","좋아. 가는 길에 마실 커피는 내가 챙길게. 그리고 옷은 겹겹이 입고 와. 거긴 쌀쌀하거든."],
      ["A","Noted. Do you know if they take cards? Some farm stands are cash only.","알았어. 거기 카드 되는지 알아? 농장 가판대 중엔 현금만 받는 데도 있던데."],
      ["B","I'll look it up tonight. I'll grab some cash anyway, just to be on the safe side.","오늘 밤에 찾아볼게. 그래도 혹시 모르니까 현금은 좀 챙겨 갈게."]
    ],
    expressions: [
      {en:"be itching to ~", ko:"‘~하고 싶어 몸이 근질근질하다’. 무언가를 무척 하고 싶어 기다리기 힘들 정도라는 느낌으로, 들뜬 마음을 가볍게 표현합니다.", eg:"The kids are itching to get out and play in the snow."},
      {en:"go overboard", ko:"‘지나치게 하다, 오버하다’. 신이 나서 사거나 먹거나 꾸미는 것을 적당한 선을 넘어 할 때 씁니다.", eg:"I went a little overboard with the decorations this year."},
      {en:"get mobbed", ko:"‘(장소가) 사람들로 미어터지다’. 가게나 행사장, 관광지가 몹시 붐빌 때 구어로 자주 씁니다.", eg:"That brunch spot gets mobbed after ten, so let's go early."},
      {en:"dress in layers", ko:"‘옷을 겹겹이 입다’. 기온이 오르내리는 날, 덥거나 추우면 벗고 입을 수 있게 여러 겹을 입으라고 권할 때 씁니다.", eg:"It's cold in the morning but warm by noon, so dress in layers."},
      {en:"(just) to be on the safe side", ko:"‘혹시 모르니까, 만일을 위해서’. 꼭 필요하진 않을 수도 있지만 대비해 두겠다는 말입니다.", eg:"I'll bring an umbrella, just to be on the safe side."}
    ],
    pattern: {
      en: "Let's aim to ~",
      ko: "‘~하는 걸 목표로 하자, ~쯤으로 잡자’. 시간이나 계획을 딱 못 박지 않고 부드럽게 정할 때 씁니다. 뒤에 명사가 오면 Let's aim for ~라고 합니다.",
      examples: [
        ["Let's <b>aim</b> to get there by <b>noon</b>.","정오까지는 도착하는 걸로 하자."],
        ["Let's <b>aim</b> to <b>finish</b> the puzzle tonight.","오늘 밤에 퍼즐 다 맞추는 걸 목표로 하자."],
        ["Let's <b>aim</b> for <b>Saturday</b> morning.","토요일 아침으로 잡아 보자."]
      ]
    }
  },

     lead:"연무가 이어지는 가운데 23일 금요일 슬랑오르와 믈라카의 학교가 평소대로 문을 열어요. 이 두 주와 파항 벤통 교육구에서 아이를 학교에 보내는 가정은 야외 활동이 멈춘다는 점을 알아두세요.",
     pts:["슬랑오르와 믈라카는 평소대로 수업하되, 연무 때문에 야외 활동은 모두 멈춰요", "슬랑오르는 등교하는 학생에게 마스크를 권하고, 학교 관리자에게 대기오염지수(API)를 꼼꼼히 살피며 위험이 큰 학생을 더 챙기라고 했어요", "믈라카는 아이 건강이 걱정되면 학교에 알린 뒤 집에 둘 수 있어요. 파항 벤통 교육구는 추후 공지 때까지 야외 활동을 멈추고, 학교 직원에게 마스크를 권해요"],

     lead:"래피드KL이 체라스와 푸트라자야에서 앱으로 부르던 온디맨드 밴을 정해진 노선을 도는 피더 밴으로 바꿔 90일 동안 시험 운행해요. 앱으로 예약할 필요 없이 정류장에서 기다렸다가 타면 돼요.",
     pts:["T400B는 반다르 툰 라작(LRT 스리 프탈링선)과 타만 미다(MRT 카장선) 역을, T512B는 프레신트 11과 푸트라자야 센트럴을 이어요", "요금은 한 번에 1링깃으로, 비접촉 체크·신용카드나 터치앤고 카드로 내요. MyRapid 할인 카드 소지자는 50% 할인, 라피드 므스라 패스가 있는 장애인은 무료예요", "시험 기간에는 두 구간의 앱 예약이 멈춰요. 래피드KL은 승객 수와 이용자 의견을 보고 다른 구간으로 넓힐지 정해요"],
     info:[["시작", "10월 24일(토)부터 90일 시험 운행"], ["시간표", "배차 간격과 운행 시간은 아직 발표되지 않았어요"]],

    {region:"말레이시아", tag:"음식", icon:"bowl", art:{vb:"0 0 66 92", tall:true, svg:'<g fill="#fff" stroke="#fff" stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round"><circle cx="25" cy="32" r="12"/><circle cx="41" cy="32" r="12"/><circle cx="33" cy="20" r="11"/><path d="M19 40h28L33 84z"/></g><path d="M19 40h28L33 84z" fill="#E9B76A" stroke="#8A5A12" stroke-width="1.5" stroke-linejoin="round"/><path d="M24 46l8 8M32 46l8 8M28 56l5 5M42 46l-8 8M34 46l-8 8M38 56l-5 5" stroke="#C98B3A" stroke-width="1.1" stroke-linecap="round"/><g stroke="#4A2E1A" stroke-width="1.5"><circle cx="25" cy="32" r="12" fill="#A9C06B"/><circle cx="41" cy="32" r="12" fill="#F2A6B8"/><circle cx="33" cy="20" r="11" fill="#FBF0D6"/></g><path d="M18 28q2-5 7-6M35 28q2-5 7-6M27 15q2-4 6-5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".85"/><g fill="#6E8A3A"><circle cx="22" cy="37" r=".9"/><circle cx="28" cy="35" r=".9"/><circle cx="24" cy="31" r=".9"/></g><g fill="#D9667F"><circle cx="44" cy="36" r=".9"/><circle cx="39" cy="38" r=".9"/></g>'}, title:"조호르바루 옛 거리에서 커피·젤라토·브런치", titleEn:"Peruvian Coffee, Gelato and Tortillas on Johor Bahru's Heritage Streets",
     lead:"말레이 메일의 케니 마가 10년 만에 조호르바루의 잘란 탄 혹 니와 잘란 도비를 다시 찾았어요. 19세기 전쟁 전 중국식 숍하우스가 늘어선 헤리티지 거리에서 하루 동안 먹고 마신 곳을 소개했어요.",
     pts:["스위트 블로섬 커피는 11년 전 타만 플랑이에서 문을 연 로스터리의 두 번째 매장으로, 페루산 원두로 필터 커피를 내려요", "안코라 젤라토 앤 베이커리에는 피스타치오·흑임자부터 계화 우롱, 올리브오일 레몬 바질, 일본 오이 젤라토까지 있어요", "식물로 가득한 브런치 카페 플라워스 인 더 윈도는 토르티야에 치킨 초리소와 아보카도, 달걀 프라이를 올린 멕시칸 브렉퍼스트를 내요"],
     info:[["어디", "23 Jalan Tan Hiok Nee(스위트 블로섬), 29 Jalan Dhoby(안코라), 9 Jalan Dhoby(플라워스 인 더 윈도)"], ["운영", "안코라 일~목 오전 10시~오후 10시, 금 오후 11시 30분까지 · 플라워스 인 더 윈도 매일 오전 9시~오후 4시"]],

    {region:"말레이시아", tag:"과학 · 연무", icon:"rain", art:{vb:"0 0 72 62", svg:'<g fill="#fff" stroke="#fff" stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round"><rect x="10" y="8" width="52" height="36" rx="3"/><path d="M30 44h12l3 8H27z"/><rect x="22" y="51" width="28" height="5" rx="2"/></g><g stroke="#4A2E1A" stroke-width="1.5" stroke-linejoin="round"><path d="M30 44h12l3 8H27z" fill="#A39E95"/><rect x="22" y="51" width="28" height="5" rx="2" fill="#5D7088"/></g><rect x="10" y="8" width="52" height="36" rx="3" fill="#3E4C5E" stroke="#1F2A36" stroke-width="1.5"/><rect x="14" y="12" width="44" height="28" fill="#DCEFF5" stroke="#1F2A36" stroke-width="1"/><circle cx="25" cy="20" r="5" fill="#F2A65A" stroke="#8A5A12" stroke-width="1"/><path d="M24 33a5 5 0 0 1 1-10a7 7 0 0 1 13 2a4.5 4.5 0 0 1 1 8z" fill="#B9AE97" stroke="#6E6A62" stroke-width="1.1" stroke-linejoin="round"/><path d="M43 20h10M45 24h8M43 28h10" stroke="#A39E95" stroke-width="1.4" stroke-linecap="round"/><g fill="#2F6B5A"><circle cx="22" cy="37" r="1.4"/><circle cx="29" cy="37" r="1.4"/><circle cx="36" cy="37" r="1.4"/><circle cx="43" cy="37" r="1.4"/><circle cx="50" cy="37" r="1.4"/></g><path d="M13 11.5h46" stroke="#5D7088" stroke-width="1" opacity=".6"/>'}, title:"연무, 이제 닷새 앞서 미리 본다", titleEn:"Malaysia's New Model Forecasts Haze Up to Five Days Ahead",
     lead:"말레이시아 기상청(MetMalaysia)이 만든 대기질 예측 모델 ‘말레이시아 CMAQ’가 대기오염과 연무를 최대 닷새 앞서 내다봐요. 아서 조셉 쿠루프 천연자원환경지속가능성부 장관이 22일 기자회견에서 소개했어요.",
     pts:["말레이시아와 동남아시아의 대기질을 자세히 예측하고, 올해부터 운영 중이며 일반인과 아세안 회원국 모두 쓸 수 있어요", "장관은 다른 나라들도 이 시스템을 써서 사람들이 닷새 앞서 계획하고 대비할 수 있길 바란다고 했어요", "말레이시아는 2027년 국경을 넘는 연무 오염에 관한 아세안 소지역 장관급 운영위원회 의장을 맡아요"],

     pts:["그림 속 그믐달과 금성, 황소자리의 히아데스 성단이 그 무렵 새벽하늘과 맞는다고 봤어요. 미술사학자들은 흔히 6월 작품으로 봐 왔어요", "그림의 별 다섯 개를 실제 별과 크기·위치·기울기를 맞춰 비교하는 ‘프로크루스테스 분석’을 쓰고, 반 고흐의 편지와 그해 7월의 상황도 살폈어요", "연구진은 6월에 구상해 7월 22일 뒤에 완성했다고 보지만, 김 대표는 이 결과가 그림의 역사를 확정적으로 바꾸지는 않는다고 했어요"],

    title: "조호르바루 ‘탄 혹 니 거리’, 이름 속 주인공은 누구일까", titleEn: "Who Was Tan Hiok Nee? The Man Behind Johor Bahru's Heritage Street",
    intro: "오늘 소식에 나온 조호르바루의 헤리티지 거리 잘란 탄 혹 니는 한 사람의 이름을 땄습니다. 후추와 감비어 농장으로 조호르의 초기 역사에 이름을 남긴 그의 이야기를 영어판 위키백과의 두 항목에서 따라가 봅니다.",
    tips: [
      ["차오저우에서 건너온 상인","탄 혹 니(Tan Hiok Nee, 1827~1902)는 중국 차오저우의 진사(Jin Sha) 마을에서 태어난 테오추(潮州)계 상인으로, 1853년 조호르로 건너와 첫 강변 개척지 허가인 부킷 브랑안을 받았습니다."],
      ["강을 따라 열린 ‘캉추’","캉추(kangchu)는 강변 정착지 개척 허가입니다. 그는 1863년까지 일곱 곳을 거느리며 조호르강 왼쪽 기슭을 아우르는 가장 큰 캉추 소유자가 되었고, 후추와 감비어를 길러 싱가포르 보트 키에서 거래했습니다."],
      ["조호르의 ‘메이저 차이나’","1870년 조호르의 화교 지도자인 메이저 차이나(카피탄 치나)가 되어 국정 위원회의 중국인 위원 두 명 가운데 하나로 뽑혔고, 술탄 아부 바카르의 신임을 받아 중국인으로는 처음 다토 S.P.M.J. 칭호를 받았습니다. 1875년에는 허가지를 팔고 싱가포르로 옮겼습니다."],
      ["거리와 옛 사원에 남은 이름","잘란 탄 혹 니는 그가 살았던 거리로, 지금도 직물 가게가 많이 늘어서 있습니다. 근처 잘란 트루스의 조호르바루 옛 중국 사원은 1870~1880년대에 그가 이끈 의흥공사(Ngee Heng) 무리가 세웠습니다."],
      ["일곱 방언 공동체가 함께 모시는 사원","옛 중국 사원은 테오추·호키엔·광둥·하카·푸저우·흥화·하이난 일곱 방언 공동체의 화합을 상징하고, 해마다 음력 정월에는 신들이 시내를 도는 ‘칭게이’ 행렬이 나흘 동안 열려 30만 명 넘게 모입니다."]
    ],

    body: "오늘 10월 23일은 화학자와 화학을 배우는 학생들이 오전 6시 2분부터 오후 6시 2분까지 기념하는 비공식 기념일 ‘몰의 날(Mole Day)’입니다. 날짜와 시각을 ‘6:02 10/23’으로 적으면 아보가드로 상수의 근삿값 6.02×10²³과 같아지기 때문입니다. 아보가드로 상수는 1몰에 들어 있는 입자의 수이고, 몰은 국제단위계(SI)의 일곱 가지 기본 단위 가운데 하나입니다.",

      "이름은 1811년 같은 온도와 압력에서 기체의 부피가 입자 수에 비례한다고 제안한 아메데오 아보가드로에서 왔고, 1909년 장 페랭이 ‘아보가드로 수’라는 이름을 붙였습니다.",

  date: "2026-10-22",
  quote: {
    ko: "내가 내 삶의 주인공이 될지, 아니면 그 자리를 다른 누군가가 차지하게 될지는 이 책장들이 보여 줄 것이다.",
    en: "Whether I shall turn out to be the hero of my own life, or whether that station will be held by anybody else, these pages must show.",
    by: "찰스 디킨스, 『데이비드 코퍼필드』 (1850)",
    pick: {kind:"책", title:"배움의 발견 (Educated, 2018) · 타라 웨스트오버", gist:"아이다호주 벅스 피크 근처의 외딴 산골, 타라 웨스트오버는 병원과 공교육과 정부를 믿지 않는 생존주의자 아버지와 고철 처리장 곁에서 자랍니다. 정규 교육을 한 번도 받지 못한 채 열일곱 살에 대학 문을 연 그녀는, 브리검영대학교를 거쳐 영국 케임브리지까지 이어지는 낯선 배움의 길을 걷습니다. 책은 배운다는 것이 지식을 쌓는 일이기 전에, 남이 정해 준 이야기에서 걸어 나와 내 눈으로 세상을 다시 보는 용기라고 조용히 말합니다.", after:"내 삶의 주인공이 누구인지는, 결국 내 손으로 넘기는 책장마다 조금씩 쓰여 갑니다."}

  english: {
    title: "옆집 택배가 우리 집으로 왔을 때", titleEn: "When a Neighbor's Package Ends Up at Your Door",
    situation: "옆집 앞으로 온 택배가 우리 집 현관에 놓여 있어서 이웃에게 건네주러 간 상황입니다. 가볍게 말을 걸고, 자연스럽게 통성명하며 이웃과 가까워지는 말투를 익혀 보세요.",
    lines: [
      ["A","Hi! Sorry to just show up like this, but I think this package was meant for you.","안녕하세요! 불쑥 찾아와서 죄송한데, 이 택배 그쪽 거 같아서요."],
      ["B","Oh, wow, thank you! I've been waiting on that for days.","어머, 고마워요! 며칠째 기다리던 거예요."],
      ["A","It ended up on our porch this morning. The label says 14B, and we're 14A.","오늘 아침에 저희 집 현관에 와 있더라고요. 라벨엔 14B인데 저흰 14A거든요."],
      ["B","That happens all the time. The delivery drivers get our places confused constantly.","그런 일 자주 있어요. 택배 기사님들이 늘 두 집을 헷갈리시더라고요."],
      ["A","Ha, good to know. If anything of ours shows up at your place, just leave it by our door.","하하, 알아 둘게요. 혹시 저희 물건이 그쪽으로 가면 그냥 저희 문 앞에 두세요."],
      ["B","Will do. I'm Dana, by the way. I don't think we've officially met.","그럴게요. 참, 전 다나예요. 정식으로 인사한 적은 없는 것 같네요."],
      ["A","I'm Chris. We moved in last month, and we're still settling in.","전 크리스예요. 지난달에 이사 왔는데 아직 자리 잡는 중이에요."],
      ["B","Welcome to the neighborhood! If you need anything, just knock.","이 동네에 오신 걸 환영해요! 필요한 거 있으면 언제든 문 두드리세요."],
      ["A","That's so nice of you. Actually, is there a decent pizza place around here?","정말 친절하시네요. 그런데 혹시 이 근처에 괜찮은 피자집 있어요?"],
      ["B","Oh, you have to try Tony's on the corner. Trust me, you'll thank me later.","아, 모퉁이에 있는 토니스는 꼭 가 보세요. 제 말 믿어요, 나중에 고마워하실 거예요."]
    ],
    expressions: [
      {en:"be meant for ~", ko:"‘~에게 가기로 된, ~ 몫인’. 원래 받을 사람이 따로 있다는 뜻으로, 물건이나 메시지가 엉뚱한 사람에게 갔을 때 씁니다.", eg:"I think this text was meant for your brother, not me."},
      {en:"wait on ~", ko:"‘~을 기다리다’. 미국 구어에서 wait for 대신 자주 씁니다. 택배, 연락, 결과처럼 오기로 한 것을 기다릴 때 자연스럽습니다.", eg:"I'm still waiting on a call back from the landlord."},
      {en:"end up ~", ko:"‘(뜻하지 않게) 결국 ~하게 되다, ~에 가 있게 되다’. 계획과 달리 어떤 곳이나 상황에 이르렀을 때 씁니다.", eg:"We got lost and ended up at a tiny diner in the next town."},
      {en:"settle in", ko:"‘(새 집이나 환경에) 자리를 잡다, 적응하다’. 이사하거나 새로 시작한 뒤 아직 정리 중이라고 할 때 still settling in이라고 자주 말합니다.", eg:"How's the new apartment? Are you all settled in?"},
      {en:"You'll thank me later.", ko:"‘나중에 나한테 고마워할걸’. 지금은 반신반의해도 내 추천을 따르면 좋을 거라고 자신 있게 권할 때 쓰는 장난스러운 말입니다.", eg:"Bring a jacket tonight. You'll thank me later."}
    ],
    pattern: {

     lead:"말레이시아 디자이너 카번 옹이 연 첫 ‘쿠알라룸푸르 패션 페스티벌(KLFF 2026)’이 10월 6일부터 18일까지 인터마크 몰에서 열렸어요. 아트리움을 분홍색으로 꾸미고 말레이시아 디자이너들의 옷을 선보였어요.",
     pts:["15일 런웨이에는 카번 옹과 다토 톰 아방 사우피, 셀레스트 토이 등 말레이시아 디자이너들이 참여했어요", "올해 50주년을 맞은 보석 브랜드 포 콩은 말레이시아 패션과 파인 주얼리를 함께 보여 주는 런웨이를 열었어요", "인터마크 몰이 말레이시아 유산과 현지 인재를 알리려고 벌이는 ‘Hail Heritage’ 활동과 이어진 행사로, 주최 측은 앞으로도 말레이시아 창작 인재를 키워 가겠다고 했어요"],
     info:[["기간", "10월 6~18일 (행사는 끝났어요)"], ["어디", "인터마크 몰 아트리움, 쿠알라룸푸르"]],

     lead:"영국 대학을 마친 유학생이 졸업 뒤 영국에 남아 일할 수 있는 졸업생 비자(Graduate visa)의 기간이 줄어요. 영국에서 학사나 석사 과정을 밟는 자녀를 둔 가정이 알아둘 내용이에요.",
     pts:["학사·석사(수업형) 졸업생은 2027년 1월 1일 전에 신청하면 2년, 그날부터 신청하면 18개월을 받아요", "1월 1일 전에 낸 신청에는 바뀐 규정이 적용되지 않아요. 박사과정 졸업생은 지금 안내로 3년이에요", "영국 안에서 학생비자로 과정을 마쳐야 신청할 수 있고 연장은 안 돼요. 신청비는 937파운드, 의료부담금(IHS)은 1년에 1,035파운드예요"],

     lead:"지구가 핼리 혜성(1P/Halley)이 남긴 부스러기 띠의 가장 짙은 곳을 지나면서, 오리온자리 유성우가 21~22일 밤 절정을 맞았어요. 스페이스닷컴이 보는 법을 정리했어요.",
     pts:["NASA는 아주 어두운 하늘이라면 시간당 10~20개를 볼 수 있다고 보지만, 보름을 나흘쯤 앞둔 달빛 때문에 덜 보일 수 있어요", "유성은 오리온자리의 붉은 별 베텔게우스 근처에서 쏟아지는 것처럼 보여요. 베텔게우스에서 45~90도 떨어진 곳의 유성이 더 길게 보인대요", "핼리 혜성은 지금 다시 태양 쪽으로 오고 있고, 다음에 태양계 안쪽을 찾아오는 건 2061년이에요"],
     info:[["관측 팁", "도시 불빛을 피하고, 눈이 어둠에 익도록 20~30분 기다리기"], ["좋은 때", "달이 진 뒤 새벽 (기사의 미국 기준)"]],

  trend: {
    title: "말레이시아 소비자 역량 지수 70.36%, ‘높음’ 단계로", titleEn: "Malaysia's Consumer Empowerment Index Rises to 70.36%",
    asOf: "2026년 10월 21일 보도 기준 (2025년 조사)",
    body: "국내무역·생활비부(KPDN)가 발표한 2025년 소비자 역량 지수(CEI)가 70.36%로, 기준이 된 2020년 첫 조사의 63.1%보다 7.26%포인트 올랐습니다. 아르미잔 모흐드 알리 장관은 소비자 역량이 ‘보통’에서 ‘높음’ 단계로 올라섰다고 밝혔습니다.",
    points: [
      "지수는 금융 이해력, 구매 결정, 피해 구제와 보상을 요구할 권리를 알고 행사하는 능력의 세 영역을 평가하며, 기준은 유럽연합과 한국에 맞춰 잡았습니다.",
      "가장 크게 오른 영역은 피해 구제 행동으로 66.84%(10.74%포인트 상승)였고, 구매 결정은 75.91%(7.11%포인트), 금융 이해력은 66.47%(3.97%포인트)였습니다.",
      "장관은 이 상승이 소비자들의 지식과 자신감, 스스로 판단하고 권리를 지키는 힘이 커졌음을 보여 준다고 말했습니다.",
      "KPDN은 대학생 소비자 교육의 장인 ‘학생 소비자 운동(GPS)’을 강화할 계획이며, 전국에 GPS 클럽 196곳이 등록돼 있습니다."
    ],
    src: [["Malay Mail (Bernama) (2026.10.21)","https://www.malaymail.com/news/malaysia/2026/10/21/malaysias-consumer-empowerment-index-rises-to-7036pc-from-631pc-in-2020/240083"]]

    title: "‘진흙탕 합류점’ 쿠알라룸푸르, 이름에 담긴 도시의 시작", titleEn: "Kuala Lumpur, the 'Muddy Confluence': How a Tin Town Got Its Name",
    intro: "매일 오가는 도시의 이름에도 이야기가 있습니다. 쿠알라룸푸르라는 이름의 뜻과, 주석 광산 마을이 수도가 되기까지를 영어판 위키백과의 두 항목에서 짧게 따라가 봅니다.",
    tips: [
      ["흔히 ‘진흙탕 합류점’으로 풀어요","말레이어로 kuala는 두 강이 만나는 곳이나 강어귀, lumpur는 진흙이라 보통 ‘진흙탕 합류점’이라고 풉니다. 다만 Sungai Lumpur(진흙 강)나 Pengkalan Lumpur(진흙 선착장)에서 왔다는 설도 있고, 이를 뒷받침할 당대 기록은 없습니다."],
      ["원래는 ‘쿠알라 곰박’이었어야?","도시는 곰박강과 클랑강이 만나는 곳에 있습니다. kuala 뒤에는 보통 흘러 들어오는 강의 이름을 붙이기 때문에, 쿠알라 곰박이라 불렀어야 한다는 주장도 있습니다."],
      ["1857년, 주석을 찾아 온 광부들","공식 설명으로는 클랑의 말레이 수장 라자 압둘라가 1857년 주석 광산을 열려고 중국인 광부들을 보냈습니다. 광부들은 쿠알라룸푸르에 내려 암팡까지 걸어가 첫 광산을 열었고, 말라리아로 많은 사람이 목숨을 잃었지만 1859년에 첫 주석을 실어 냈습니다."],
      ["배가 닿는 마지막 나루","쿠알라룸푸르는 배가 클랑강을 거슬러 믿고 오를 수 있는 가장 먼 곳이어서, 광산으로 물자를 나르는 거점이 되었습니다."],
      ["불과 홍수를 딛고 수도로","1880년 슬랑오르의 주도가 클랑에서 쿠알라룸푸르로 옮겨졌고, 1881년 1월 불로 도시 전체가 탔으며 그해 말에는 큰 홍수가 났습니다. 그 뒤 영국 행정관 프랭크 스웨트넘은 불에 덜 타도록 건물을 벽돌과 기와로 짓게 했고, 도시는 1972년 2월 1일 시로 승격해 1974년 2월 1일 연방직할구가 되었습니다."]
    ],
    src: [["Wikipedia: Kuala Lumpur","https://en.wikipedia.org/wiki/Kuala_Lumpur"],["Wikipedia: History of Kuala Lumpur","https://en.wikipedia.org/wiki/History_of_Kuala_Lumpur"]]

    body: "1797년 10월 22일, 프랑스의 앙드레자크 가르느랭이 파리 몽소 공원 위로 떠오른 기구에서 약 1,000m(3,000피트) 높이에서 줄을 끊고 낙하산으로 내려왔습니다. 그는 뼈대 없는 낙하산을 만든 사람으로 꼽히며, 이날 지름 약 7m의 낙하산 아래 매단 바구니에 타고 있었습니다. 줄이 끊긴 기구는 계속 위로 올라갔고, 바구니는 땅에 부딪히며 긁혔지만 그는 다치지 않았습니다.",

     pts:["2011년 한 연구는 육상 생물종의 86%, 해양 생물종의 91%가 아직 공식적으로 기재되지 않았다고 추정했어요", "2025년 국제자연보전연맹(IUCN)이 멸종 위험을 평가한 종은 알려진 종의 약 8%뿐이었어요", "프랑스 국립자연사박물관(MNHN) 연구원 파니 크라츠는 파리 식물원과 다른 16곳의 곤충 덫을 매주 살피며 DNA로 빈칸을 채워요. 덫 하나에서 DNA 유형이 261개까지 나오기도 해요"],

    title: "말레이시아 ‘똑똑한 온라인 쇼핑객’은 5명 중 1명", titleEn: "Only One in Five Malaysian Online Shoppers Is a 'Savvy' Shopper, Study Finds",
    asOf: "2026년 10월 20일 보도 기준",
    body: "라자다와 조사업체 큐브 아시아가 동남아시아 6개 시장의 18~61세 온라인 쇼핑객 6,000명을 조사한 ‘2026 이커머스 세이비 쇼퍼 보고서’를 내놓았습니다. 상품 정보 확인, 가성비 따지기, 구매 보호에 대한 자신감, 디지털 활용 능력의 네 가지 기준으로 가려낸 ‘세이비 쇼퍼’는 말레이시아 온라인 쇼핑객의 20%로, 지역 평균 24%보다 낮았습니다.",
    points: [
      "말레이시아의 세이비 쇼퍼는 일반 소비자보다 한 달에 36% 더 쓰며, 두 집단의 지출 차이는 한 해 약 9억 달러(약 36억 7,000만 링깃)로 계산됐습니다.",
      "네 기준 가운데 세 가지를 갖춘 ‘거의 세이비’ 쇼핑객은 17%였고, 이 가운데 45%는 정보 확인 하나만 부족했습니다.",
      "세이비 쇼퍼의 39%는 더 나은 구매 보호를 위해 돈을 더 낼 수 있다고 답해 일반 쇼핑객(24%)보다 높았고, 43%는 장터 안의 공식 ‘몰(Mall)’ 코너에서 대부분을 삽니다.",
      "연구진은 이 지출 차이가 습관 때문에 더 쓴 돈이 아니라 세이비 쇼퍼의 더 높은 구매력을 반영한 것이라고 설명했고, 라자다 말레이시아의 카야 친 CEO는 ‘더 많이가 아니라 잘 쓰도록 돕는 것’이 목표라고 말했습니다."

    title: "올해 엘니뇨는 역대 최강일까, 답이 엇갈리는 이유", titleEn: "Is This the Strongest El Niño Ever? Why Scientists Can't Agree",
    intro: "영국 기상청은 올해 엘니뇨를 ‘전례 없는’ 수준이라 부르고, 일본 기상청은 관측 이래 가장 강하다고 하지만, 미국 예보관들은 아직 가장 큰 엘니뇨들에는 못 미친다고 봅니다. 같은 바다를 보고도 답이 다른 까닭을 AFP 보도에서 정리했습니다.",
    tips: [
      ["엘니뇨는 이렇게 선언해요","니뇨3.4 해역 수온이 평년보다 0.5°C 이상 높고, 무역풍이 약해지고 열대 강우가 동쪽으로 옮겨 가는 식으로 대기가 함께 반응할 때 엘니뇨를 선언합니다. 평균 2~7년마다 찾아와 9~12개월 이어집니다."],
      ["영국은 ‘실제 수온’을 봐요","영국 기상청은 적도 태평양 중부의 절대 해수면 온도가 이전 엘니뇨 때보다 높다는 점을 근거로 듭니다. 다른 기관들은 역사적 기준값에서 얼마나 벗어났는지, 곧 편차를 잽니다."],
      ["일본은 다른 바다를 재요","일본 기상청은 동태평양 니뇨3 해역의 편차로 순위를 매기며, 1949년부터의 관측에서 1997년을 넘어섰다고 봅니다. 미국은 그보다 서쪽의 니뇨3.4 해역을 봅니다."],
      ["미국은 잣대를 바꿨어요","바다 전체가 따뜻해지면서, 미국 해양대기청(NOAA)은 30년 평균과 비교하던 ONI 대신 동중부 태평양 수온을 나머지 열대 바다와 비교하는 RONI로 바꿨고, 세계기상기구(WMO)도 같은 전환을 진행하고 있습니다."],
      ["순위는 끝나 봐야 알아요","NOAA는 RONI 3개월 평균 편차가 2.5°C 이상이면 1950년부터의 기록에서 가장 강한 엘니뇨가 된다고 보며, 그 가능성을 ‘높음’으로 봅니다. 마이애미대 에밀리 베커는 어느 잣대로 보든 매우 강한 엘니뇨이지만 역사 속 자리는 끝난 뒤에야 정할 수 있다고 말했습니다."]

     lead:"프탈링자야 섹션 14 밀레니엄 스퀘어의 가족 식당 ‘빅바스켓 키친(BigBasket Kitchen)’을 말레이 메일이 소개했어요. 70대 하이난계 요리사 마거릿과 뇨냐인 자매 애비게일 림이 집안 레시피로 꾸리는 작은 가게예요.",
     pts:["하이난 치킨라이스는 주문을 받으면 바로 빚는 라이스 볼과 함께 나오고 9.50링깃이에요", "나시 르막(9.50링깃)은 요일마다 곁들이가 바뀌어요. 월·화는 카피탄 치킨, 수·목은 치킨 른당, 금요일은 오탁오탁 치킨이에요", "뇨냐 쿠이도 날마다 바뀌어요. 풀룻 팡강은 5링깃, 풀룻 인티는 2.50링깃이고, 퉁수이(3.50링깃)는 정해진 날에만 나와요"],

     lead:"호주 정부 유학 안내 사이트 스터디 오스트레일리아가 타임스 고등교육(THE) 세계대학순위 2027의 호주 결과를 정리했어요. 호주 대학 진학을 생각하는 가정이 참고할 만해요.",
     pts:["호주 대학 37곳이 순위에 올랐어요. 호주 대학의 약 88%예요", "100위 안에는 멜버른대, 시드니대, 모내시대, 퀸즐랜드대, UNSW 시드니, 호주국립대(ANU)가 들었고, 애들레이드대, UTS, 매쿼리대, 서호주대(UWA)까지 200위 안에 모두 10곳이에요", "7곳이 지난해보다 순위가 올랐고, 매쿼리대와 RMIT대는 역대 가장 높은 순위를 받았어요"],

     lead:"일본 우주항공연구개발기구(JAXA)의 탐사선 MMX가 H3 로켓에 실려 다네가시마 우주센터에서 발사됐어요. 일본 시간 20일 새벽 4시 41분, 말레이시아 시간으로는 새벽 3시 41분이에요.",
     pts:["약 10개월을 날아 2027년 8월 화성에 닿고, 화성 주변에서 약 3년을 보내요. 포보스에 두 번 내려앉아 시료 약 10g을 모을 계획이에요", "프랑스와 독일이 함께 만든 로버 IDEFIX가 2028년 말이나 2029년 초 포보스에 내려가요", "시료 캡슐은 2031년 호주에 내릴 예정이에요. 성공하면 포보스에 착륙해 시료를 지구로 가져오는 첫 탐사선이 돼요"],

  trend: {
    title: "연무에 공기청정기 판매 600% 늘었다", titleEn: "Haze Sends Air Purifier Sales Soaring",
    asOf: "2026년 10월 18일 보도 기준",
    body: "인도네시아 산불에서 넘어온 연무가 몇 달째 이어지면서, 동남아시아 곳곳에서 공기청정기와 산소 장비를 찾는 사람이 크게 늘었다고 AFP가 전했습니다. 소매업체들은 공기 질이 나빠지기 시작한 8월부터 공기청정기 판매가 늘었다고 밝혔습니다.",
    points: [
      "지역 가전 소매 체인 코츠(Courts)는 9월 28일부터 10월 12일까지 공기청정기 판매량이 지난해 같은 기간보다 600% 늘었다고 밝혔습니다.",
      "싱가포르에 본사를 둔 게인 시티(Gain City)는 10월 9일부터 수요가 급격히 늘어, 지금 판매가 8월 연무철이 시작될 때의 9배라고 밝혔습니다.",
      "쿠알라룸푸르 외곽의 의료기기 업체 AA 얼라이브(AA Alive)는 연무 때문에 판매가 35% 늘었고, 하루 약 40대의 대여 장비를 배달하고 있습니다.",
      "이 업체 기술자는 보통 1,000시간을 쓰면 바꾸는 산소발생기 필터의 수명이 연무 오염 물질 때문에 절반으로 줄었다고 말했습니다."
    ],
    src: [["Malay Mail (AFP) (2026.10.18)","https://www.malaymail.com/news/life/2026/10/18/malaysians-queue-for-clean-air-lifelines-as-haze-sends-purifier-demand-into-overdrive/239564"]]

  life: {
    title: "동해안 섬 여행은 몬순 달력부터 확인하세요", titleEn: "Check the Monsoon Calendar Before Booking an East Coast Island",
    intro: "반도 동해안의 섬들은 계절에 따라 문을 열고 닫습니다. 북동 몬순이 오기 전에 알아두면 좋은 것을 말레이시아 기상청(MetMalaysia)과 영어판 위키백과에서 골랐습니다. 리조트와 배편은 떠나기 전에 꼭 직접 확인하세요.",
    tips: [
      ["북동 몬순은 11월부터 3월까지","말레이시아 기상청에 따르면 북동 몬순은 11월부터 3월까지 이어지며, 특히 반도 동해안 주에 많은 비를 뿌리고 남중국해에 강한 바람과 거친 파도를 일으킵니다."],
      ["프렌티안은 11~2월에 사실상 닫혀요","프렌티안 제도는 11월부터 2월까지 몬순이 거세 리조트와 페리가 멈추고, 관광객에게는 사실상 닫힙니다. 섬에는 포장도로와 활주로가 없어 쿠알라 브슷 선착장에서 쾌속선으로 오갑니다."],
      ["레당은 10월부터 3월까지 조심","레당섬은 10월부터 3월까지 리조트 대부분이 닫고 배편도 크게 줄어듭니다. 비가 가장 많은 달은 11~2월, 가장 건조한 달은 4~8월이며, 배는 므랑이나 샤반다르 선착장에서 리조트가 운영합니다."],
      ["티오만은 조호르와 파항 양쪽에서","티오만섬으로 가는 페리는 조호르 므르싱과 파항 탄중 그목에서 떠나고, 표는 창구에서 사거나 페리 회사 웹사이트에서 미리 예약할 수 있습니다. 섬은 면세 지역이기도 합니다."],
      ["해양공원에는 규칙이 있어요","프렌티안 제도는 1994년 해양공원으로 지정되어 해안에서 2마일 안에서는 모든 낚시가 금지됩니다. 티오만섬 주변 바다도 이웃한 여덟 섬과 함께 해양공원과 해양보호구역으로 지정돼 있습니다."]
    ],

     pts:["셩지엔바오는 한 개 3링깃이고, 굽는 데 10분쯤 걸려요. 리뷰어는 클랑 밸리에서 손꼽히게 맛있다고 했어요", "상하이식 홍소육은 46링깃으로, 후난식보다 더 달고 끈적하대요", "풋고추와 양파를 넣고 볶은 달걀 요리는 18링깃이고, 직접 담근 김치가 진한 요리 사이에서 입맛을 산뜻하게 잡아 줘요"],

     lead:"호주 교육부가 15일 낸 고등교육 등록 예비 통계에서, 올해 호주 대학에 새로 들어온 해외 유학생이 지난해보다 4.9% 줄었어요. 호주 대학 진학을 생각하는 가정이 참고할 흐름이에요.",
     pts:["5월 1일 기준 신입 해외 유학생은 12만 3,968명으로, 지난해 같은 때의 13만 415명보다 줄었어요", "전체 해외 유학생은 47만 4,716명에서 47만 2,245명으로 0.5% 줄어, 최근 몇 년의 빠른 증가세가 멈췄어요", "교육부는 정책 변화와 경제 여건을 이유로 들었어요. 2026년 신입 유학생 국가 계획 수준은 29만 5,000명이고, 재정·영어 요건 강화와 ‘진정한 학생(Genuine Student)’ 심사, 비자 신청비 인상도 시행 중이에요"],

     pts:["잡히는 물고기가 줄고 작아지는 걸 걱정한 마노아 두와이가 원로들을 설득해 30×40m로 시작한 보호 구역이, 지금은 280×240m로 넓어졌어요", "2011년 생긴 마을 청년 모임이 구역을 돌보며, 2023년 한 해에만 산호 1만 8,000개와 맹그로브 1만 그루를 심었어요", "올해 바닷물이 최고 39도까지 오른 폭염에도 심은 산호의 약 20%가 살아남았고, 마을은 이 ‘슈퍼 산호’를 수도 수바 근처의 더 깊고 시원한 바다로 옮겨 심고 있어요"],

    title: "올해 디파발리 바자르, 브릭필즈는 자리가 바뀌었어요", titleEn: "This Year's Brickfields Deepavali Bazaar Has Moved",
    intro: "디파발리를 앞두고 쿠알라룸푸르에서 디파발리 바자르가 열리고 있습니다. 오래 산 사람도 헷갈리기 쉬운 올해 달라진 점과 장 보러 가기 전에 알아두면 좋은 것을, 더 스타 보도와 영어판 위키백과에서 골랐습니다.",
    tips: [
      ["20여 년 만에 리틀 인디아 거리를 떠났어요","올해 브릭필즈 바자르는 늘 열리던 리틀 인디아 거리 대신, 잘란 툰 삼반탄 1에 있는 툰 삼반탄 복합 건물 근처 DBKL 축구장 주차장에 100칸으로 섭니다. 이 바자르가 전통적인 자리를 떠난 것은 20년이 넘어 처음입니다."],
      ["기간은 10월 9일부터 11월 7일까지","바자르는 30일 동안 열립니다. 브릭필즈 자리에서는 ‘드라이 굿즈(dry goods)’와 함께 음식과 음료도 팔 수 있습니다."],
      ["마스지드 인디아는 잘란 부누스 6에 작게","마스지드 인디아 쪽은 잘란 부누스 6에 20칸이 서고, 드라이 굿즈만 팝니다. 두 곳을 합쳐 120칸으로, 지난해 140칸보다 줄었습니다."],
      ["옮긴 이유는 개발과 혼잡","예전 자리 가운데 일부가 개발로 쓸 수 없게 됐고, 오래된 혼잡과 소음, 안전 문제를 줄이려고 한곳으로 모았다고 쿠알라룸푸르시청(DBKL)이 설명했습니다."],
      ["문간의 랑골리와 집 안의 등불","디파발리에는 쌀가루나 꽃잎, 색을 입힌 쌀이나 모래로 문간에 랑골리를 꾸미고, 집과 사원, 일터를 디야(기름 등잔)와 초, 등불로 밝힙니다."]

    intro: "말레이시아는 주(州)에 따라 주말 요일도, 공휴일도 조금씩 다릅니다. 다른 주로 여행하거나 출장을 잡을 때, 또 다가오는 디파발리 연휴를 계획할 때 알아두면 좋은 차이를 영어판 위키백과와 현지 매체 SAYS에서 골랐습니다.",
    tips: [
      ["크다·클란탄·트렝가누는 금·토가 주말","대부분의 주와 연방직할구는 토·일이 주말이지만, 크다·클란탄·트렝가누는 금·토가 주말이고 일요일부터 목요일까지 일합니다."],
      ["조호르는 2025년부터 다시 토·일","조호르는 2014년에 주말을 금·토로 바꿨다가, 10년 만인 2025년 1월 1일부터 토·일로 되돌렸습니다."],
      ["주말에 겹친 공휴일은 주마다 다르게 대체","토·일이 주말인 주에서는 일요일에 겹친 공휴일이 월요일로 넘어갑니다. 크다에서는 금요일에, 클란탄과 트렝가누에서는 토요일에 겹친 공휴일이 일요일이나 다음 근무일로 넘어갑니다."],
      ["올해 디파발리는 11월 8일 일요일","디파발리는 사라왁을 뺀 전국 공휴일입니다. SAYS에 따르면 8일이 일요일이라 9일 월요일이 이어지는 휴일이 되지만, 크다·클란탄·사라왁·트렝가누는 9일을 공휴일로 쉬지 않습니다."],
      ["주마다 따로 쉬는 날도 있습니다","모든 주에서 그 주 통치자나 주지사의 공식 생일이 공휴일입니다. 타이푸삼은 다섯 개 주와 연방직할구 두 곳, 누줄 알쿠란은 일곱 개 주와 세 연방직할구에서만 쉽니다."]

    intro: "믈라카 포르투갈식 커리 뒤에는 1511년부터 이어진 한 공동체의 이야기가 있습니다. 크리스탕 사람들과 그들의 말에 대해, 영어판 위키백과의 두 항목에서 골랐습니다.",
    tips: [
      ["이름은 ‘그리스도인’에서","크리스탕(Kristang)은 그리스도인을 뜻하는 포르투갈어 Cristão에서 온 이름입니다. 1511년 포르투갈 함대가 믈라카를 정복한 뒤 포르투갈 남성과 현지 여성의 혼인이 장려됐고, 1604년까지 기록된 혼인만 약 200건이었습니다."],
      ["여러 나라 말이 섞인 크리올","크리스탕어는 포르투갈어를 바탕으로 한 크리올어입니다. 새우 페이스트 belacã는 말레이어, 할아버지 tata는 타밀어, 화장실 kakus는 네덜란드어, 뚱뚱하다는 godru는 포르투갈어에서 왔습니다."],
      ["1933년에 세운 포르투갈 정착촌","흩어진 공동체를 한데 모으고 문화를 지키려고 1933년 믈라카 우중 파시르에 포르투갈 정착촌이 세워졌습니다. 오랫동안 가난한 어촌이었지만 지금은 이름난 관광지입니다."],
      ["6월 말의 성인 축일","6월 24일 성 요한(San Juang) 축일에서 시작해, 어부의 수호성인인 성 베드로(San Pedro)의 6월 29일 축일로 끝나는 축일들이 이어집니다."],
      ["식탁과 말을 지키는 사람들","가장 사랑받는 음식은 데빌 커리(cari debal)이고 파인애플 새우 커리도 있습니다. 크리스탕어는 학교에서 가르치지 않아 믈라카의 화자가 약 750명이지만, 말레이시아와 싱가포르에서 되살리기 노력이 이어지고 있습니다."]
    ],

    body: "오늘 10월 17일은 유엔이 정한 ‘세계 빈곤 퇴치의 날’입니다. 1987년 10월 17일 파리 트로카데로에 10만 명이 넘는 사람들이 모여 극심한 빈곤과 폭력, 굶주림의 희생자들을 기린 것이 시작이었고, 유엔은 1992년에 이날을 공식 기념일로 정했습니다.",

      "2026~2028년의 주제는 ‘평화와 인권을 위해 하나로’이고, 2026년에는 ‘모두를 위한 안전한 집’에 초점을 맞춰 적절한 주거를 강조합니다."

      ["A","Hey, are we still on for the potluck on Saturday?","토요일 포틀럭 파티, 그대로 하는 거지?"],
      ["B","Totally. I've got a headcount of about twelve people so far.","당연하지. 지금까지 한 열두 명 온대."],
      ["A","Wow, nice turnout. What should I bring? I don't want to show up empty-handed.","와, 꽤 많이 오네. 나 뭐 가져갈까? 빈손으로 가긴 싫어서."],
      ["B","Could you handle a side dish? We're kind of swimming in desserts at this point.","곁들일 요리 하나 맡아 줄래? 지금 디저트가 넘쳐 나거든."],
      ["A","Ha, sure. I can whip up my roasted veggie salad. It's always a crowd-pleaser.","하하, 좋아. 내 구운 채소 샐러드 뚝딱 만들어 갈게. 늘 반응이 좋거든."],
      ["B","Perfect. Just a heads-up, Jen went vegan, so the more plant-based stuff, the better.","딱이다. 미리 말해 두는데, 젠이 비건이 됐어. 그러니까 식물성 음식은 많을수록 좋아."],
      ["A","Good to know. I'll leave the feta off, then.","알려 줘서 고마워. 그럼 페타 치즈는 빼야겠다."],
      ["B","You're the best. Oh, and if you have any folding chairs, could you bring a couple?","역시 최고야. 아, 접이식 의자 있으면 두어 개 가져와 줄래?"],
      ["A","No problem. I'll throw them in the trunk. Want me to come early and help set up?","문제없어. 트렁크에 실어 갈게. 일찍 가서 준비 도와줄까?"],
      ["B","That'd be amazing. Swing by around five, and we'll get everything ready.","그럼 너무 좋지. 다섯 시쯤 들러. 같이 다 준비하자."]
    ],
    expressions: [
      {en:"Are we still on for ~?", ko:"‘~ 약속 그대로지?’. 전에 정해 둔 약속이 아직 유효한지 가볍게 확인할 때 씁니다. 대답은 We're still on이나 Totally처럼 합니다.", eg:"Are we still on for coffee tomorrow morning?"},
      {en:"show up empty-handed", ko:"‘빈손으로 가다’. 초대받은 자리에 아무것도 가져가지 않는 것을 말합니다. I don't want to show up empty-handed는 뭐라도 들고 가고 싶다는 예의 바른 말입니다.", eg:"Let's grab some flowers on the way. I hate showing up empty-handed."},
      {en:"whip up ~", ko:"‘(음식을) 뚝딱 만들다’. 빠르고 간단하게 요리해 낸다는 느낌을 줍니다.", eg:"I can whip up some pasta if you're hungry."},
      {en:"a crowd-pleaser", ko:"‘누구나 좋아하는 것’. 음식, 영화, 노래처럼 사람들의 반응이 늘 좋은 것을 가리킵니다.", eg:"Bring the chocolate chip cookies. They're always a crowd-pleaser."},
      {en:"swing by", ko:"‘잠깐 들르다’. stop by보다 한결 가볍고 캐주얼한 말로, 오가는 길에 들른다는 느낌입니다.", eg:"I'll swing by your place after work to drop off the book."}
    ],
    pattern: {
      en: "The more ~, the better.",
      ko: "‘~할수록 좋다’. 비교급을 두 번 써서, 한쪽이 늘수록 더 좋아진다는 뜻을 짧게 말합니다. 사람이 많을수록 즐겁다는 The more, the merrier도 같은 틀입니다.",
      examples: [
        ["The <b>sooner</b>, the <b>better</b>.","빠를수록 좋아."],
        ["The <b>more</b>, the <b>merrier</b>.","많을수록 즐겁지."],
        ["The <b>closer</b> to the <b>beach</b>, the <b>better</b>.","해변에 가까울수록 좋아."]
      ]
    }
  },

    title: "10월 16일은 왜 ‘세계 식량의 날’일까", titleEn: "Why Is October 16 World Food Day?",
    body: "오늘 10월 16일은 ‘세계 식량의 날’입니다. 1945년 10월 16일 캐나다 퀘벡시에서 유엔 식량농업기구(FAO)가 세워진 날을 기념하는 것으로, FAO 회원국들이 1979년 11월 제20차 총회에서 이 기념일을 정했습니다. 지금은 해마다 150개가 넘는 나라에서 이날을 기념합니다.",
    more: [
      "세계적인 기념일을 처음 제안한 것은 전 농식품부 장관 팔 로마니 박사가 이끈 헝가리 대표단이었습니다.",
      "FAO의 첫 본부는 미국 워싱턴 D.C.에 있었고, 1951년 이탈리아 로마로 옮겼습니다.",
      "1981년부터는 해마다 다른 주제를 내걸고 있습니다."
    ],
    src: [["Wikipedia: World Food Day","https://en.wikipedia.org/wiki/World_Food_Day"],["Wikipedia: Food and Agriculture Organization","https://en.wikipedia.org/wiki/Food_and_Agriculture_Organization"]]
  }

    intro: "말레이시아에서는 이메일이나 안내문, 관공서 창구에서 이름 앞에 말레이어 호칭을 붙여 부릅니다. 영어판 위키백과의 말레이 경칭 항목에서 일상에서 자주 마주치는 것을 골랐습니다.",
    tips: [
      ["남성은 누구나 ‘엔칙(Encik)’","Encik은 모든 남성에게 쓸 수 있는 호칭으로, 영어의 Mr.에 해당합니다."],
      ["기혼 여성은 ‘푸안(Puan)’","Puan은 결혼한 여성에게 쓰며 Pn.으로 줄여 씁니다. 남편의 이름을 쓰는 여성은 Puan 뒤에 남편의 이름을 붙여 부르기도 합니다."],
      ["미혼 여성은 ‘칙(Cik)’","Cik은 영어의 Miss에 해당하며, 결혼하지 않은 여성에게 씁니다."],
      ["‘투안(Tuan)’은 편지에서만","Tuan은 본래 ‘주인’이라는 뜻이라 식민지 시대의 느낌 때문에 일상에서는 거의 쓰지 않습니다. 다만 공식 서신에서는 영어의 Sir처럼 씁니다."],
      ["다툭의 아내는 ‘다틴’, 하지는 ‘하자’","Datuk 작위를 받은 남성의 아내는 Datin, Tan Sri의 아내는 Puan Sri라고 부릅니다. 메카 순례를 마친 사람은 Haji(여성은 Hajah)를 붙이며 Hj., Hjh.로 줄여 씁니다."]

    body: "1582년 10월 4일 목요일의 다음 날은 10월 15일 금요일이었습니다. 교황 그레고리오 13세가 1582년 2월 24일 칙서 ‘인테르 그라비시마스(Inter gravissimas)’로 정한 그레고리력이 이때 시행되면서 날짜가 열흘 앞당겨졌기 때문입니다. 1년을 정확히 365.25일로 본 율리우스력에서는 춘분 날짜가 조금씩 어긋났고, 춘분은 부활절 날짜를 계산하는 기준이라 교회에 중요한 문제였습니다.",
    more: [
      "그레고리력에서는 4로 나누어떨어지는 해가 윤년이지만, 100으로 나누어떨어지면서 400으로는 나누어떨어지지 않는 해는 윤년이 아닙니다. 그래서 2000년은 윤년, 1900년은 평년이었습니다.",
      "처음에는 유럽의 가톨릭 국가들과 그 해외 영토가 이 달력을 받아들였습니다.",
      "대영제국은 1752년에야 그레고리력으로 바꿨습니다."

     pts:["참나무, 오리나무, 물푸레나무, 서어나무 같은 토종 식물을 1만 그루 넘게 심었어요", "약 25헥타르가 습지가 되어 큰주홍부전나비 같은 희귀종이 살아요. 이탈리아에서 하나뿐인 흑꼬리도요 번식 기록지이기도 해요", "카르나롤리 클라시코 같은 옛 품종을 화학비료 없이 기르고, 수확 사이에는 양 약 1,200마리가 논에서 풀을 뜯어요"],

  trend: {
    title: "2006년 전자상거래법, 새 법으로 바뀐다", titleEn: "Malaysia Moves to Replace Its 2006 E-Commerce Act",
    asOf: "2026년 10월 13일 보도 기준",
    body: "정부가 2027년 예산안 발표에서, 주로 전자 거래의 법적 효력을 인정하는 데 그쳤던 2006년 전자상거래법을 폐지하고 플랫폼과 판매자의 의무를 분명히 하는 새 법으로 바꾸겠다고 밝혔습니다. 국내무역·생활비부는 9월 19일 이 정책 결정을 승인했고, 법안은 2027년 3월 의회 회기에 상정될 전망이라고 기사는 전했습니다.",
    points: [
      "2025년 10월 국내무역·생활비부(KPDN) 검토에서는 온라인 장터 운영을 다루는 종합적인 틀이 없고, 판매자가 소비자를 속였을 때 플랫폼 책임이 불분명하다는 점이 지적됐습니다.",
      "말레이시아 소비자를 상대하는 해외 판매자와 플랫폼에 대한 단속이 제한적이라는 점도 빈틈으로 꼽혔습니다.",
      "새 법에는 판매자 신원 확인과 정보 공개 강화, 상품 안전 조치, 신고부터 결정까지 이어지는 온라인 분쟁 해결 창구가 담길 수 있고, 플랫폼 면허제도 검토 중입니다.",
      "새 법이 시행되기 전까지는 1999년 소비자보호법과 2024년 전자거래 규정이 계속 적용됩니다."
    ],
    src: [["Malay Mail (2026.10.13)","https://www.malaymail.com/news/malaysia/2026/10/13/malaysia-is-getting-a-new-e-commerce-law-what-could-change-for-online-shoppers/238661"]]

  life: {
    title: "같은 ‘락사’, 다른 국수: 지역마다 달라지는 한 그릇", titleEn: "Same Name, Different Bowl: How Laksa and Hokkien Mee Change by Region",
    intro: "말레이시아에서는 같은 이름의 국수가 지역에 따라 전혀 다른 음식으로 나옵니다. 이름만 보고 시켰다가 놀라지 않도록, 영어판 위키백과의 락사와 호키엔 미 항목에서 차이를 정리했습니다.",
    tips: [
      ["KL의 ‘락사’는 커리 락사","클랑 밸리에서는 코코넛 수프 국수인 커리 미를 락사나 커리 락사라고도 부릅니다. 튀긴 두부와 꼬막, 긴 콩, 민트를 넣고 노란 에그누들이나 쌀국수를 씁니다."],
      ["페낭 ‘아삼 락사’는 새콤한 생선 국물","아삼(asam)은 음식에 신맛을 내는 재료를 두루 가리키는 말로, 타마린드가 새콤한 맛을 냅니다. 삶아 잘게 부순 고등어로 국물을 내고 민트와 파인애플, 새우 페이스트로 맛을 냅니다."],
      ["사라왁 락사는 그곳만의 향신료","다른 주의 락사에는 없는 향신료 조합이 특징입니다. 쌀국수에 닭고기, 달걀지단, 새우, 숙주, 고수를 올립니다."],
      ["조호르 락사는 스파게티로","구운 울프 헤링과 코코넛 밀크로 진하게 끓인 국물에 스파게티를 씁니다. 주로 명절이나 특별한 날에 먹습니다."],
      ["호키엔 미, KL은 볶음·페낭은 국물","KL의 호키엔 미는 굵은 노란 면을 진한 간장에 볶은 호키엔 차 미입니다. 페낭의 호키엔 미는 매콤한 새우 국물이 특징인 국수로, 하 미(hae mee)라고도 부릅니다."]

     body:"테오 니 칭 통신부 부장관은 FINAS 본부에서 열린 제35회 말레이시아 영화제(FFM35) 출범 행사에서, 2025년 영화 관객이 2024년 714만 명에서 107.7% 늘어 1,483만 명이었다고 밝혔습니다. 자국 영화 흥행 수입도 1억 6,657만 링깃에서 2억 4,795만 링깃으로 올라 최고 기록을 세웠고, 1위는 7,364만 링깃을 번 ‘Blood Brothers: Bara Naga’였습니다. FFM35 시상식은 11월 21일 이스타나 부다야에서 열립니다.",

     body:"트렝가누 주립박물관위원회가 10월 11일부터 13일까지 사흘간 쿠알라트렝가누의 트렝가누 승마 리조트(TER)에서 왕실 뮤지컬 연극을 올립니다. 텡쿠 달람 칼툼이 1936년에 쓴 문학 작품 ‘Syair Tawarikh Sultan Zainal Abidin III’를 알리 주소가 희곡으로 옮기고 마르주키 알리가 무대에 올린 작품으로, 술탄 자이날 아비딘 3세의 치세(1881~1918년)가 배경입니다. 위원회는 박물관이 유물과 필사본을 보존하는 곳에 그치지 않고 연구와 교육의 중심이 되도록 하려는 시도라고 설명했습니다.",

    {tag:"생활", icon:"school", art:{vb:"0 0 72 62", svg:'<g fill="#fff" stroke="#fff" stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round"><path d="M20 28a16 16 0 0 1 32 0v22a5 5 0 0 1-5 5H25a5 5 0 0 1-5-5z"/><path d="M30 13a6 6 0 0 1 12 0" fill="none"/><rect x="14" y="32" width="6" height="15" rx="3"/><rect x="52" y="32" width="6" height="15" rx="3"/></g><g stroke="#4A2E1A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M30 13a6 6 0 0 1 12 0" fill="none" stroke-width="2.6"/><rect x="14" y="32" width="6" height="15" rx="3" fill="#C8553D"/><rect x="52" y="32" width="6" height="15" rx="3" fill="#C8553D"/><path d="M20 28a16 16 0 0 1 32 0v22a5 5 0 0 1-5 5H25a5 5 0 0 1-5-5z" fill="#E0704F"/><path d="M20.4 30h31.2" fill="none"/><rect x="26" y="37" width="20" height="14" rx="3" fill="#F2A65A"/><path d="M26 42h20" fill="none"/><rect x="33.5" y="40" width="5" height="4.4" rx="1" fill="#F2CF6B" stroke-width="1.1"/><circle cx="36" cy="23" r="2.2" fill="#F5E4BA" stroke-width="1.2"/></g><path d="M25 22q3-6 9-7" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".6"/>'}, title:"조호르주, 연무로 모든 학교 휴교를 16일까지 연장", titleEn: "Johor Extends School Closures Through October 16 Over Haze",
     body:"조호르 주정부는 연무 때문에 주 안의 모든 학교와 교육기관의 휴교를 10월 12일부터 16일까지 닷새 더 이어 가기로 했습니다. 조호르 섭정 툰쿠 마코타 이스마일의 명에 따른 결정으로, 주 교육·정보위원회 위원장 무하마드 나킵 가잘리 박사가 10일 성명으로 알렸습니다. 13~15일 사이 인도네시아 칼리만탄 쪽에서 불어올 바람이 국경을 넘는 오염을 실어 올 수 있다는 전망이 나왔고, 대기오염지수(API)는 170~180으로 보고됐습니다. 이 기간에 잡힌 시험과 평가는 미루고, 가능한 곳에서는 가정 학습(PdPR)을 이어 갑니다.",
     src:"Bernama", url:"https://www.bernama.com/en/general/news.php?id=2618405"},

     body:"가무다 랜드가 가무다 코브에 280실 규모의 호텔 ‘아사이 가무다 코브(ASAI Gamuda Cove)’의 개관 행사를 열었습니다. 아사이(ASAI) 브랜드 호텔 가운데 가장 크고, 쿠알라룸푸르 국제공항(KLIA)에서 약 20분 거리입니다. 450헥타르 규모의 파야 인다 디스커버리 웻랜즈 옆에 자리해 습지를 내려다보는 인피니티 풀을 두었고, 식음 시설은 세 곳입니다. 첫 손님은 사전 개관 단계인 9월 15일에 맞았습니다.",
     src:"BernamaBiz", url:"https://www.bernamabiz.com/news.php?id=2618412"},

     body:"안와르 총리는 9일 2027년 예산안을 발표하며, 1만 7,000가구 규모로 계획된 서민 주택 도시 ‘반다르 마다니 부킷 잘릴’의 1단계 등록을 월요일에 시작한다고 밝혔습니다. 수직형 학교를 비롯한 편의 시설을 갖춘 주거지로 개발됩니다. 정해진 수입이 없는 자영업자를 비롯해 생애 첫 주택 구입자 8만 명을 돕도록 주택신용보증제도(SJKP)로 최대 200억 링깃의 대출 보증도 제공합니다. 등록 자격은 기사에 나와 있지 않습니다.",

  life: {
    title: "휴대폰 앱의 AQI와 정부 API, 숫자가 다른 이유", titleEn: "Why Your App's AQI and the Official API Don't Match",
    intro: "연무가 심한 요즘, 앱에는 250이 뜨는데 정부 발표는 175인 날이 있습니다. 말레이시아 환경부(DOE)는 수치를 숨긴 것이 아니라 재는 방식이 다르기 때문이라고 설명했습니다.",
    tips: [
      ["공식 수치는 APIMS와 MyJAS EQMS","환경부는 APIMS 웹 포털이나 MyJAS EQMS 모바일 앱을 보라고 권합니다. 둘 다 한 시간마다 갱신되고, 정부의 건강 권고와 재난 대응이 이 수치를 기준으로 합니다."],
      ["API와 AQI는 서로 다른 지수","말레이시아의 대기오염지수(API)와 민간 AQI 서비스는 지수 척도, 계산 모델, 농도 기준, 평균을 내는 시간, 갱신 주기가 다릅니다. 해외 앱 가운데는 미국 AQI 기준을 쓰는 곳이 많습니다."],

      <button type="button" class="heart" aria-pressed="${on}" aria-label="${on ? "하트를 보냈어요" : "이 호에 하트 보내기"}"${lock ? " disabled" : ""}>${HEART}</button>
      <p class="lk-n"><b>${n.toLocaleString("ko-KR")}</b> 하트</p>
      ${on ? `<p class="lk-note">하트를 보내 주셔서 고마워요</p>` : (!canPress ? `<p class="lk-note">이 링크에서는 하트 수만 볼 수 있어요</p>` : "")}`;
  }
  async function webGet(d){
    const r = await fetch(`${API}/get/${NS}/heart-${d}`, {cache:"no-store"});
    if(r.status === 404) return 0;
    if(!r.ok) throw new Error("http " + r.status);
    const j = await r.json(); return Number(j.value) || 0;
  }
  async function webHit(d){
    const r = await fetch(`${API}/hit/${NS}/heart-${d}`, {cache:"no-store"});
    if(!r.ok) throw new Error("http " + r.status);
    const j = await r.json(); return Number(j.value) || 0;
  }
  async function show(){
    const d = today(), my = ++seq;
    if(mode === "web" && counts[d] === undefined){
      box.hidden = true;
      try { const n = await webGet(d); if(my !== seq) return; counts[d] = n; } catch(e){ return; }
    }
    if(my === seq) paint();
  }
  box.addEventListener("click", async ev => {
    const b = ev.target && ev.target.closest ? ev.target.closest("button.heart") : null;
    if(!b || b.disabled || busy) return;
    const d = today(); busy = true; b.disabled = true;
    try {
      if(mode === "web"){
        counts[d] = await webHit(d); keep.set("sde-heart-" + d, "1");
      } else if(mode === "db"){
        const next = myDays.concat([d]).slice(-60);
        await db.collection("likes").doc(uid).set({days: next});
        myDays = next;
      }
    } catch(e){
      if(mode === "db") canPress = false;
    }
    busy = false; paint();
    const nb = box.querySelector(".heart"); if(nb && mine(d)){ nb.classList.add("pop"); burst(nb); }
  });
  function burst(btn){
    const bx = box.getBoundingClientRect(), r = btn.getBoundingClientRect();
    const w = document.createElement("span"); w.className = "burst";
    w.style.left = (r.left - bx.left + r.width / 2) + "px"; w.style.top = (r.top - bx.top + r.height / 2) + "px";
    const cols = ["#C8553D", "#E0704F", "#F2A65A", "#E7B9A8", "#DDA22F", "#B5462F"];
    let html = "";
    for(let i = 0; i < 22; i++){
      const a = (Math.PI * 2 * i / 22) + (Math.random() - .5) * .5, dist = 55 + Math.random() * 75;
      const x = Math.cos(a) * dist, y = Math.sin(a) * dist - 25 - Math.random() * 30;
      html += `<i style="--x:${x.toFixed(1)}px;--y:${y.toFixed(1)}px;--r:${Math.round((Math.random() - .5) * 120)}deg;--s:${Math.round(9 + Math.random() * 11)}px;--c:${cols[i % cols.length]};--t:${(0.7 + Math.random() * 0.5).toFixed(2)}s;--d:${(Math.random() * 0.08).toFixed(2)}s">${HEART}</i>`;
    }
    w.innerHTML = html; box.appendChild(w);
    setTimeout(() => w.remove(), 1500);
  }
  const _r = render;
  render = function(){ _r(); show(); };
  async function start(){
    const c = window.claude;
    if(c && typeof c.use === "function"){
      try {
        db = await c.use("db");
        const user = db ? await c.use("user") : null;
        uid = user ? await user.id() : null;
        if(db){
          const w = user ? await user.can("data.write") : null;
          canPress = !!uid && w !== false;
          mode = "db";
          db.collection("likes").onSnapshot(snap => {
            for(const k in counts) delete counts[k];
            DAYS.forEach(x => { counts[x.date] = 0; });
            snap.docs.forEach(doc => {
              const v = doc.data(), days = v && Array.isArray(v.days) ? v.days : [];
              days.forEach(x => { if(typeof x === "string" && x in counts) counts[x]++; });
              if(doc.id === uid && !busy) myDays = days.filter(x => typeof x === "string");
            });
            paint();
          }, () => { mode = null; paint(); });
          return;
        }
      } catch(e){ db = null; }
    }
    mode = "web"; show();
  }
  start();
})();
</script>
