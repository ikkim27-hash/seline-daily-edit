<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seline Daily">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="icon" type="image/png" href="icon-192.png?v=3">
<link rel="manifest" href="manifest.webmanifest?v=3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDE3D2">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Seline's Daily Edit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&family=Syne:wght@600;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: a sticker-zine column. Thick ink outlines, hard offset shadows, one color-blocked panel per section; the dialogue is a chat thread. */
:root{
  --bg:#EDE3D2; --surface:#FBF7EF; --ink:#1B2321; --muted:#5A615E; --edge:#D6C9B3;
  --hot:#4F7868; --on-hot:#FFFFFF; --pop:#7A5A14; --on-pop:#FFFFFF; --mint:#DCE8E1; --on-mint:#2F5A4B;
  --sky:#E9E6DF; --on-sky:#1B2321;
  --drill-bg:#14352E; --drill-fg:#F2F0EC; --drill-hi:#DFC585;
  --display:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --latin:"Source Sans 3","Helvetica Neue","Segoe UI",Arial,sans-serif;
}
:root{color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.7}
.wrap{max-width:640px;margin:0 auto;padding-inline:18px;padding-block:26px 64px;display:flex;flex-direction:column;gap:30px}
h1,h2,h3,p,ol{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.box{border:2.5px solid var(--edge);border-radius:20px;box-shadow:5px 5px 0 var(--edge)}

/* 머리 */
.mast{display:flex;flex-direction:column;gap:12px}
.mast .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mast h1{font-family:var(--display);font-weight:400;font-size:3.6rem;line-height:1;letter-spacing:-.01em}
.mast h1 span{color:var(--hot)}
.stamp{font-family:var(--latin);font-weight:800;font-size:.8rem;letter-spacing:.06em;background:var(--pop);color:var(--on-pop);border:2.5px solid var(--edge);border-radius:999px;padding:6px 14px;transform:rotate(-4deg);white-space:nowrap}
.date{font-size:1rem;color:var(--muted)}
.daynav{display:flex;gap:8px}
.daynav button{background:var(--surface);border:2px solid var(--edge);border-radius:999px;padding:3px 14px;font-size:.88rem}
.daynav button:disabled{opacity:.3;cursor:default}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;padding-block:8px}
.tabs a{flex:1;text-align:center;text-decoration:none;font-family:var(--display);font-size:1.02rem;padding:7px 6px;border:2.5px solid var(--edge);border-radius:14px;background:var(--surface)}
.tabs a:nth-child(1){background:var(--pop);color:var(--on-pop)}
.tabs a:nth-child(2){background:var(--hot);color:var(--on-hot)}
.tabs a:nth-child(3){background:var(--mint);color:var(--on-mint)}

section{display:flex;flex-direction:column;gap:18px;scroll-margin-top:70px}
.label{align-self:flex-start;font-family:var(--display);font-size:.95rem;padding:3px 14px;border:2.5px solid var(--edge);border-radius:999px}
h2{font-family:var(--display);font-weight:400;font-size:1.85rem;line-height:1.25;text-wrap:balance}
.sub{color:var(--muted);font-size:.95rem}

/* 영어: 채팅 */
#english .label{background:var(--pop);color:var(--on-pop)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools button{background:var(--surface);border:2px solid var(--edge);border-radius:999px;padding:5px 14px;font-size:.9rem}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chat{background:var(--sky);color:var(--on-sky);padding:18px 14px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;flex-direction:column;gap:3px;max-width:86%;min-width:0}
.msg.b{align-self:flex-end;align-items:flex-end}
.bubble{background:var(--surface);color:var(--ink);border:2.5px solid var(--edge);border-radius:18px 18px 18px 4px;padding:9px 14px;text-align:left;font-family:var(--latin);font-size:1.1rem;line-height:1.4;font-weight:600}
.msg.b .bubble{background:var(--pop);color:var(--on-pop);border-radius:18px 18px 4px 18px}
button.bubble:active{transform:translate(2px,2px)}
.msg .ko{font-size:.88rem;padding-inline:6px;opacity:.85}
.hint{font-size:.85rem;text-align:center;opacity:.8}
.exprs{display:grid;gap:14px}
.expr{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.expr h3{font-family:var(--latin);font-weight:800;font-size:1.25rem;line-height:1.3}
.expr h3 i{font-style:normal;display:inline-block;background:var(--pop);color:var(--on-pop);border-radius:6px;padding:0 6px;margin-right:6px;font-size:.9rem}
.expr p{font-size:.97rem}
.expr .eg{font-family:var(--latin);color:var(--muted);font-size:1rem}
.drill{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.drill h3{font-family:var(--display);font-weight:400;font-size:1.15rem;color:var(--pop)}
.drill .pat{font-family:var(--latin);font-weight:800;font-size:1.3rem;line-height:1.3}
.drill ol{padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-family:var(--latin);font-size:1.05rem}
.drill small{font-family:var(--body);opacity:.8;font-size:.86rem}
.drill b{color:var(--pop);font-weight:800}

/* 뉴스 */
#news .label{background:var(--hot);color:var(--on-hot)}
.news{display:flex;flex-direction:column;gap:16px}
.news article{background:var(--surface);padding:16px 16px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.news .n{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--hot);grid-row:1/3}
.news .tag{justify-self:start;font-size:.78rem;border:2px solid var(--edge);border-radius:999px;padding:0 9px;background:var(--mint);color:var(--on-mint)}
.news h3{font-size:1.12rem;font-weight:700;line-height:1.45;text-wrap:balance;min-width:0}
.news p{grid-column:1/-1;font-size:.98rem}
.news .src{font-size:.84rem;color:var(--muted)}

/* 날씨 */
#weather .label{background:var(--mint);color:var(--on-mint)}
.now{background:var(--mint);color:var(--on-mint);padding:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.now .t{font-family:var(--display);font-size:4.2rem;line-height:1}
.now .d{display:flex;flex-direction:column;min-width:0}
.now .d b{font-size:1.15rem}
.alert{background:var(--hot);color:var(--on-hot);padding:12px 16px;font-size:.96rem;border:2.5px solid var(--edge);border-radius:14px}
.cities{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.city{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.city h3{font-family:var(--display);font-weight:400;font-size:1.05rem}
.city .r{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;font-variant-numeric:tabular-nums}
.city .r span:last-child{white-space:nowrap}
.city em{font-style:normal;color:var(--muted);font-size:.82rem;margin-left:4px}
footer{color:var(--muted);font-size:.84rem}
/* 정제된 톤: 얇은 선, 그림자 없음, 가는 숫자 */
body{font-weight:400;letter-spacing:-.005em}
.box{border:1px solid var(--edge);border-radius:14px;box-shadow:none}
.mast h1{font-weight:300;font-size:3rem;letter-spacing:-.03em}
.mast h1 span{color:var(--pop);font-weight:600}
.stamp{transform:none;font-weight:500;letter-spacing:.14em;background:none;color:var(--pop);border:1px solid var(--pop)}
.daynav button,.tools button,.news .tag,.alert{border-width:1px}
.tabs{border-bottom:1px solid var(--edge);gap:0}
.tabs a:nth-child(n){background:none;color:var(--muted);border:0;border-radius:0;font-weight:500;font-size:.98rem;letter-spacing:.04em}
.tabs a:nth-child(n):hover{color:var(--ink)}
.label{border:0;padding:0;border-radius:0;font-weight:600;font-size:.8rem;letter-spacing:.16em}
#english .label,#news .label,#weather .label,#life .label{background:none;color:var(--pop)}
.tips{list-style:none;padding:0;display:flex;flex-direction:column;background:var(--surface)}
.tips li{display:grid;grid-template-columns:2.2em 1fr;gap:4px 8px;padding:14px 16px;border-bottom:1px solid var(--edge)}
.tips li:last-child{border-bottom:0}
.tips .k{font-family:var(--latin);font-weight:300;font-size:1.5rem;line-height:1.2;color:var(--pop)}
.tips b{font-weight:600;display:block}
.tips span{min-width:0;font-size:.97rem}
.lifesrc{font-size:.84rem;color:var(--muted)}
#fact .label,#trend .label{background:none;color:var(--pop)}
.asof{font-size:.84rem;color:var(--muted)}
#shows .label{background:none;color:var(--pop)}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs a:nth-child(n){flex:1 0 auto;padding-inline:12px}
.showlist{list-style:none;margin:0;padding:0;background:var(--surface);display:flex;flex-direction:column}
.showlist li{display:grid;grid-template-columns:3.4em 1fr;gap:2px 12px;padding:14px 16px;border-bottom:1px solid var(--edge)}
.showlist li:last-child{border-bottom:0}
.showlist .kind{font-size:.78rem;font-weight:600;color:var(--pop);padding-top:3px}
.showlist .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.showlist b{font-weight:600;font-size:1.02rem}
.showlist .when{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.showlist .memo{font-size:.92rem}
#music .label{background:none;color:var(--pop)}
.listen{display:flex;flex-wrap:wrap;gap:10px}
.listen a{font-size:.9rem;font-weight:500;color:var(--ink);text-decoration:none;border:1px solid var(--ink);padding:7px 14px}
.listen a:hover{background:var(--ink);color:var(--bg)}
.showlist .stitle{color:var(--ink);text-decoration:none}
.showlist .stitle:hover b{text-decoration:underline;text-underline-offset:4px}
.showlist .more{align-self:flex-start;margin-top:6px;font-size:.86rem;font-weight:500;color:var(--ink);text-decoration:none;border:1px solid var(--ink);padding:5px 12px}
.showlist .more:hover{background:var(--ink);color:var(--bg)}
.factbox{background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:12px}
.factbox p{font-size:1rem}
.factbox ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.tabs a:nth-child(n){font-size:.9rem;letter-spacing:0;padding-inline:2px;white-space:nowrap}
.quote{margin:0;padding:22px 20px;background:var(--drill-bg);color:var(--drill-fg);border-radius:14px;display:flex;flex-direction:column;gap:10px}
.quote .q{font-size:.8rem;font-weight:600;letter-spacing:.16em;color:var(--drill-hi)}
.quote .ko{font-size:1.3rem;font-weight:500;line-height:1.55;letter-spacing:-.02em;text-wrap:balance}
.quote .en{font-family:var(--latin);font-weight:300;font-size:1.08rem;line-height:1.5;opacity:.9}
.quote .by{font-size:.86rem;opacity:.75}
:root{--aq1:#3E8E5A;--aq2:#C29A1E;--aq3:#D0702F;--aq4:#B23A3A;--aq5:#7A3A7A}
.air{background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px}
.air h3{font-weight:600;font-size:1.05rem}
.air .meta{font-size:.86rem;color:var(--muted)}
.airrow{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 2.6em;gap:10px;align-items:center;font-size:.93rem}
.airrow .bar{height:8px;border-radius:999px;background:var(--edge);overflow:hidden}
.airrow .bar i{display:block;height:100%;border-radius:999px}
.airrow .v{font-family:var(--latin);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.voice{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);min-width:0}
.voice select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--edge);border-radius:999px;padding:5px 12px;max-width:12em}
h2{font-weight:600;font-size:1.6rem;letter-spacing:-.02em}
.bubble{border:1px solid var(--edge);font-weight:400;font-size:1.08rem}
.msg.b .bubble{background:var(--hot);color:var(--on-hot);border-color:var(--hot)}
.expr h3{font-weight:600;font-size:1.15rem}
.expr h3 i{background:none;color:var(--pop);padding:0;font-weight:500}
.drill{background:var(--drill-bg);color:var(--drill-fg);border-radius:14px}
.drill h3{font-weight:600;font-size:.85rem;letter-spacing:.14em;color:var(--drill-hi)}
.drill .pat{font-weight:500}
.drill b{color:var(--drill-hi);font-weight:600}
.news .n{font-family:var(--latin);font-weight:300;color:var(--pop)}
.news h3{font-weight:600}
.now{background:var(--hot);color:var(--on-hot);border-color:var(--hot)}
.now .t{font-family:var(--latin);font-weight:300}
.now .d b{font-weight:500}
.city h3{font-weight:600;font-size:.98rem}
/* ===== 매거진 레이아웃: 큰 제호, 표지 문장, 차례, 굵은 괘선과 2단 그리드 ===== */
:root{--edit:"Source Sans 3","IBM Plex Sans KR","Helvetica Neue","Apple SD Gothic Neo",sans-serif}
.mast .tag,.quote .en,.tabs a .go,.tochead,.expr h3 i,.drill .pat,.news .n,.tips .k,.h-en,.msg .sp{font-style:normal !important}
body{word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:780px;gap:56px;padding-block:20px 80px}
.strip{display:flex;justify-content:space-between;gap:12px;font-family:var(--latin);font-size:.72rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);padding:7px 0;color:var(--ink)}
.mast{gap:14px}
.mast .row{align-items:flex-end}
.mast h1{font-family:"Cormorant Garamond","Garamond","Baskerville","Times New Roman",serif;font-weight:500;font-size:clamp(1.7rem,7.4vw,3.6rem);line-height:1.22;letter-spacing:.14em;text-transform:uppercase;min-width:0}
.mast h1 span{display:block;color:var(--ink);font-weight:500;font-style:normal}
.mast .row{flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:12px}
.cup{flex:0 0 auto;width:clamp(104px,30vw,190px);height:auto;aspect-ratio:1;object-fit:cover;border-radius:50%;margin-bottom:.2em}
.mast .tag{font-family:var(--body);font-size:1rem;font-weight:500;letter-spacing:.3em;line-height:1.2;color:var(--pop)}
.stamp{display:none}
.mast .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--edge);padding-top:10px}
.daynav button{border-radius:0;border-color:var(--ink);background:none;font-size:.82rem}
.quote{border-radius:0;padding:clamp(28px,7vw,56px) clamp(20px,6vw,48px);gap:16px}
.quote .q{font-family:var(--latin);letter-spacing:.22em;font-size:.72rem}
.photo{margin:0;display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--ink);padding-top:14px}
.photo .plabel{font-size:.74rem;font-weight:600;letter-spacing:.16em;color:var(--pop)}
.photo img{display:block;width:100%;max-width:100%;height:auto}
.photo figcaption{display:flex;justify-content:space-between;gap:12px;font-size:.95rem}
.photo .pdate{color:var(--muted);font-family:var(--latin);font-size:.82rem;white-space:nowrap}
.quote .pick{border-top:1px solid color-mix(in srgb,var(--drill-fg) 30%,transparent);padding-top:14px;margin-top:6px;font-size:.95rem;line-height:1.65}
.quote .pick b{display:block;font-size:.72rem;letter-spacing:.16em;color:var(--drill-hi);font-weight:600;margin-bottom:4px}
.quote .ko{font-size:clamp(1.28rem,4.96vw,2.16rem);font-weight:600;line-height:1.3;letter-spacing:-.04em}
.quote .en{font-family:var(--edit);font-style:italic;font-weight:400;font-size:clamp(1.2rem,4.4vw,1.7rem);line-height:1.25;opacity:1;color:var(--drill-hi)}
.tabs{position:static;display:grid;grid-template-columns:1fr;gap:0;padding:0;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);overflow:visible;background:none}
.tabs a:nth-child(n){display:grid;grid-template-columns:5.2em 1fr auto;gap:12px;align-items:baseline;text-align:left;padding:12px 0;border-bottom:1px solid var(--edge);border-radius:0;white-space:normal;color:var(--ink);font-size:1rem;letter-spacing:-.01em;font-weight:500}
.tabs a:last-child{border-bottom:0}
.tabs a .sec{font-size:.74rem;font-weight:600;letter-spacing:.14em;color:var(--pop)}
.tabs a .ttl{min-width:0}
.tabs a .go{font-family:var(--edit);font-style:italic;color:var(--muted);font-size:1.1rem}
.tabs a:nth-child(n):hover .ttl{text-decoration:underline;text-underline-offset:4px}
.h-en{display:block;font-family:var(--edit);font-style:italic;font-weight:400;letter-spacing:0;color:var(--muted);font-size:.52em;line-height:1.2;margin-top:.3em}
h3 .h-en{font-size:.82em}

.tochead{font-family:var(--edit);font-style:italic;font-size:1.5rem;line-height:1;margin-bottom:-44px}
section{gap:20px;border-top:3px solid var(--ink);padding-top:14px}
.label,#english .label,#news .label,#life .label,#fact .label,#trend .label,#shows .label{font-family:var(--body);font-size:.74rem;letter-spacing:.16em;color:var(--pop)}
h2{font-size:clamp(1.52rem,5.3vw,2.4rem);font-weight:700;line-height:1.18;letter-spacing:-.045em}
.sub{font-size:1.02rem;max-width:36em}
.box{border-radius:0}
.chat{border:0;padding:22px 16px}
.bubble{border-radius:16px 16px 16px 2px}
.msg.b .bubble{border-radius:16px 16px 2px 16px}
.expr{border:0;border-top:1px solid var(--ink);padding:14px 0 0;background:none}
.expr h3{font-size:1.3rem;letter-spacing:-.02em}
.expr h3 i{font-family:var(--edit);font-style:italic;font-size:1.5rem;margin-right:10px}
.drill{border-radius:0;padding:22px}
.drill .pat{font-family:var(--edit);font-style:italic;font-weight:400;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.15}
.news{gap:0}
.news article{border:0;border-top:1px solid var(--ink);background:none;padding:18px 0 22px;grid-template-columns:auto 1fr;gap:6px 14px}
.news article:first-child{border-top:0;padding-top:0}
.news .n{font-family:var(--edit);font-style:italic;font-weight:400;font-size:3rem;line-height:.9}
.news h3{font-size:1.25rem;font-weight:700;letter-spacing:-.03em;line-height:1.35}
.news article:first-child h3{font-size:clamp(.9rem,3.24vw,1.26rem);line-height:1.4}
.news .tag{border:0;background:none;padding:0;color:var(--pop);font-weight:600;letter-spacing:.12em;font-size:.72rem}
.factbox{border:0;background:none;padding:0}
.factbox>p{font-size:1.12rem;line-height:1.8}
.factbox ul{border-top:1px solid var(--edge);padding-top:14px}
.tips,.showlist{border:0;border-top:1px solid var(--ink);background:none}
.tips li,.showlist li{padding-inline:0}
.tips .k{font-family:var(--edit);font-style:italic;font-size:1.9rem;font-weight:400}
.showlist li{grid-template-columns:4.2em 1fr}
.showlist .kind{letter-spacing:.1em}
footer{border-top:3px solid var(--ink);padding-top:14px}
/* 대화: 모두 왼쪽 정렬, 화자는 글자로 구분 */
.chat{background:none;color:var(--ink);padding:0;gap:0;border-top:1px solid var(--ink)}
.msg,.msg.b{display:grid;grid-template-columns:1.9em 1fr;gap:0 12px;max-width:none;align-self:stretch;align-items:start;padding:14px 12px;border-bottom:1px solid var(--edge)}
.msg.b{background:var(--mint)}
.msg .sp{font-family:var(--edit);font-size:1.5rem;line-height:1.15;color:var(--pop)}
.msg.b .sp{color:var(--on-mint)}
.msg .txt{min-width:0;display:flex;flex-direction:column;gap:4px}
.msg .bubble,.msg.b .bubble{margin:0;background:none;border:0;border-radius:0;padding:0;color:var(--ink);font-family:var(--latin);font-size:1.2rem;font-weight:500;line-height:1.45;letter-spacing:0;text-align:left}
.msg .ko{margin:0;padding:0;font-size:.93rem;color:var(--muted);opacity:1}

@media (min-width:700px){
  .tabs{grid-template-columns:1fr 1fr;column-gap:36px}

  .exprs{grid-template-columns:1fr 1fr;column-gap:36px;row-gap:22px}
  .news{display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
  .news article:first-child{grid-column:1/-1;padding-bottom:28px}
  .news article:nth-child(2),.news article:nth-child(3){border-top:1px solid var(--ink)}
  .factbox>p{column-count:1;max-width:34em}
  .tips{display:grid;grid-template-columns:1fr 1fr;column-gap:36px}

}
.tochead{font-weight:600;font-size:1.15rem;letter-spacing:-.01em}
.news article{grid-template-columns:auto 1fr auto}

    <h2>${esc(f.title)}${hen(f.titleEn)}</h2>
    <p class="sub">${esc(f.intro)}</p>
    <ol class="tips box">${f.tips.map((t,i)=>`<li><span class="k">${i+1}</span><span><b>${esc(t[0])}</b>${esc(t[1])}</span></li>`).join("")}</ol>
    <p class="lifesrc">출처 ${f.src.map(s=>`<a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(" · ")}</p>`;

  const sh = d.shows;
  $("shows").hidden = !sh;
  if(sh) $("shows").innerHTML = `
    <span class="label">전시 · 공연</span>
    <h2>이번 주 볼거리${hen("What's On This Week")}</h2>
    <p class="sub">${esc(sh.intro)}</p>
    <ul class="showlist box">${sh.items.map(x=>`<li><span class="kind">${esc(x.kind)}</span><span class="body"><a class="stitle" href="${esc(x.url)}" target="_blank" rel="noopener"><b>${esc(x.title)}</b></a><span class="when">${esc(x.when)} · ${esc(x.where)}</span>${x.memo ? `<span class="memo">${esc(x.memo)}</span>` : ""}<a class="more" href="${esc(x.url)}" target="_blank" rel="noopener">자세히 보기 →</a></span></li>`).join("")}</ul>`;

  const mu = d.music;
  $("music").hidden = !mu;
  if(mu){
    const qs = encodeURIComponent(mu.query || (mu.artist + " " + mu.title));
    $("music").innerHTML = `
    <span class="label">Now Playing · Seline’s Pick</span>
    <h2>${esc(mu.title)}<span class="h-en">${esc(mu.artist)} · ${esc(mu.year)}</span></h2>
    <p class="asof">${esc(mu.mood)}</p>
    <p class="sub">${esc(mu.why)}</p>
    <div class="listen"><a href="https://www.youtube.com/results?search_query=${qs}" target="_blank" rel="noopener">Listen on YouTube →</a><a href="https://open.spotify.com/search/${qs}" target="_blank" rel="noopener">Listen on Spotify →</a></div>`;
  }

  const k = d.fact;
  $("fact").hidden = !k;
  if(k) $("fact").innerHTML = `
    <span class="label">오늘의 상식</span>
    <h2>${esc(k.title)}${hen(k.titleEn)}</h2>
    <div class="factbox box"><p>${esc(k.body)}</p>
      ${k.more && k.more.length ? `<ul>${k.more.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>` : ""}</div>
    ${k.src && k.src.length ? `<p class="lifesrc">출처 ${k.src.map(x=>`<a href="${esc(x[1])}" target="_blank" rel="noopener">${esc(x[0])}</a>`).join(" · ")}</p>` : ""}`;

  $("foot").textContent = "뉴스는 각 기사 원문을 한국어로 요약한 것입니다. 정확한 내용은 출처 링크에서 확인하세요.";
}
$("prev").onclick = () => { if(idx < DAYS.length-1){ idx++; render(); } };
$("next").onclick = () => { if(idx > 0){ idx--; render(); } };
render();
</script>

</body>
</html>
